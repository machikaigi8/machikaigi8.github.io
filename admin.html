/* =====================================
   JSON取得
   ===================================== */


async function readJson(
  response
) {

  const text =
    await response.text();


  if (!text) {

    return {};

  }


  try {

    return JSON.parse(
      text
    );

  } catch {

    return {

      error_description:
        text

    };

  }

}


/* =====================================
   ID・PWログイン
   ===================================== */


async function requestPasswordLogin(
  username,
  password
) {

  const body =
    new URLSearchParams({

      grant_type:
        "http://auth0.com/oauth/grant-type/password-realm",

      client_id:
        AUTH0_CLIENT_ID,

      username:
        username,

      password:
        password,

      realm:
        AUTH0_REALM,

      audience:
        API_AUDIENCE,

      scope:
        "openid profile"

    });


  const response =
    await fetch(

      `${AUTH0_BASE}/oauth/token`,

      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body

      }

    );


  return {

    response,

    data:
      await readJson(
        response
      )

  };

}


/* =====================================
   MFA登録情報取得
   ===================================== */


async function getAuthenticators(
  mfaToken
) {

  const response =
    await fetch(

      `${AUTH0_BASE}/mfa/authenticators`,

      {

        headers: {

          "Authorization":
            `Bearer ${mfaToken}`

        }

      }

    );


  const data =
    await readJson(
      response
    );


  if (
    !response.ok
  ) {

    throw new Error(

      data.error_description ||
      "二段階認証情報を取得できませんでした。"

    );

  }


  return data;

}


/* =====================================
   Guardian Push
   ===================================== */


async function requestPushChallenge(
  mfaToken,
  authenticatorId
) {

  const response =
    await fetch(

      `${AUTH0_BASE}/mfa/challenge`,

      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            client_id:
              AUTH0_CLIENT_ID,

            mfa_token:
              mfaToken,

            challenge_type:
              "oob",

            authenticator_id:
              authenticatorId

          })

      }

    );


  const data =
    await readJson(
      response
    );


  if (
    !response.ok
  ) {

    throw new Error(

      data.error_description ||
      "Guardianへの通知を送信できませんでした。"

    );

  }


  return data;

}


/* =====================================
   Guardian初回登録
   ===================================== */


async function associateGuardian(
  mfaToken
) {

  const response =
    await fetch(

      `${AUTH0_BASE}/mfa/associate`,

      {

        method:
          "POST",

        headers: {

          "Authorization":
            `Bearer ${mfaToken}`,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            authenticator_types:
              ["oob"],

            oob_channels:
              ["auth0"]

          })

      }

    );


  const data =
    await readJson(
      response
    );


  if (
    !response.ok
  ) {

    throw new Error(

      data.error_description ||
      "Guardianの登録を開始できませんでした。"

    );

  }


  return data;

}


/* =====================================
   Guardian承認確認
   ===================================== */


async function verifyOob(
  mfaToken,
  oobCode
) {

  const body =
    new URLSearchParams({

      grant_type:
        "http://auth0.com/oauth/grant-type/mfa-oob",

      client_id:
        AUTH0_CLIENT_ID,

      mfa_token:
        mfaToken,

      oob_code:
        oobCode

    });


  const response =
    await fetch(

      `${AUTH0_BASE}/oauth/token`,

      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body

      }

    );


  return {

    response,

    data:
      await readJson(
        response
      )

  };

}


/* =====================================
   待機
   ===================================== */


function wait(
  milliseconds
) {

  return new Promise(

    resolve =>

      setTimeout(
        resolve,
        milliseconds
      )

  );

}


/* =====================================
   Guardian承認待ち
   ===================================== */


async function pollGuardian(
  mfaToken,
  oobCode
) {

  pollingStopped =
    false;


  let interval =
    5000;


  for (
    let attempt = 0;
    attempt < 30;
    attempt++
  ) {


    if (
      pollingStopped
    ) {

      return;

    }


    await wait(
      interval
    );


    const {
      response,
      data
    } =
      await verifyOob(

        mfaToken,

        oobCode

      );


    if (
      response.ok &&
      data.access_token
    ) {

      finishLogin(
        data
      );

      return;

    }


    if (
      data.error ===
      "authorization_pending"
    ) {

      continue;

    }


    if (
      data.error ===
      "slow_down"
    ) {

      interval =
        Math.min(

          interval + 2000,

          10000

        );

      continue;

    }


    throw new Error(

      data.error_description ||
      "二段階認証を完了できませんでした。"

    );

  }


  throw new Error(
    "認証待ちがタイムアウトしました。"
  );

}

/* =====================================
   ログイン完了

   Auth0のNameを取得して
   左上に表示する
   ===================================== */


function finishLogin(
  tokenData
) {

  pollingStopped =
    true;


  const expiresAt =
    Date.now() +
    (
      Number(
        tokenData.expires_in ||
        600
      ) * 1000
    );


  /*
     名前が取得できなかった場合は
     ログインIDを表示
  */

  let displayName =
    adminId.value.trim() ||
    "管理者";


  /*
     openid profile で取得した
     ID TokenからNameを読む
  */

  if (
    tokenData.id_token
  ) {

    try {


      const parts =
        tokenData.id_token.split(
          "."
        );


      if (
        parts.length >= 2
      ) {


        const payloadPart =
          parts[1];


        const normalized =
          payloadPart
            .replace(
              /-/g,
              "+"
            )
            .replace(
              /_/g,
              "/"
            );


        const padded =
          normalized +
          "=".repeat(

            (
              4 -
              normalized.length % 4
            ) % 4

          );


        const claims =
          JSON.parse(

            decodeURIComponent(

              Array.from(
                atob(
                  padded
                )
              )

              .map(

                character =>

                  "%" +

                  character
                    .charCodeAt(0)
                    .toString(16)
                    .padStart(
                      2,
                      "0"
                    )

              )

              .join("")

            )

          );


        displayName =
          claims.name ||
          claims.nickname ||
          displayName;


      }


    } catch (
      error
    ) {

      console.error(

        "ID token profile decode error:",

        error

      );

    }

  }


  sessionStorage.setItem(

    "admin_access_token",

    tokenData.access_token

  );


  sessionStorage.setItem(

    "admin_expires_at",

    String(
      expiresAt
    )

  );


  sessionStorage.setItem(

    "admin_username",

    displayName

  );


  showAdmin();

}


/* =====================================

function showAdmin() {

/* =====================================
   ログイン画面表示
   ===================================== */


function showLogin() {

  adminContent.style.display =
    "none";


  loggedInTopbar.style.display =
    "none";


  pageSubtitle.style.display =
    "block";


  loginSection.style.display =

}


/* =====================================
   セッション削除
   ===================================== */


function clearSession() {

  sessionStorage.removeItem(
    "admin_access_token"
  );


  sessionStorage.removeItem(
    "admin_expires_at"
  );


  sessionStorage.removeItem(
    "admin_username"
  );

}


/* =====================================
   セッション復元
   ===================================== */


function restoreSession() {

  const token =
    sessionStorage.getItem(
      "admin_access_token"
    );


  const expiresAt =
    Number(

      sessionStorage.getItem(
        "admin_expires_at"
      ) || 0

    );


  if (
    !token ||
    Date.now() >= expiresAt
  ) {

    clearSession();

    showLogin();

    return;

  }


  showAdmin();

}

    loginButton.disabled =

    const username =

    const password =
      adminPassword.value;


    try {


      showAuthStatus(

      const {
        response,
        data
      } =
        await requestPasswordLogin(

          username,

          password

        );


      adminPassword.value =
        "";


      /*
         MFAなしでAccess Tokenが
         発行された場合は拒否
      */

      if (
        response.ok &&
        data.access_token
      ) {

        throw new Error(
          "Auth0で二段階認証が要求されませんでした。MFAポリシーを確認してください。安全のため管理画面は開きません。"
        );

      }


      if (
        data.error !==
          "mfa_required" ||
        !data.mfa_token
      ) {


        if (
          data.error ===
          "invalid_grant"
        ) {

          throw new Error(
            "IDまたはパスワードが違います。"
          );

        }


        throw new Error(

          data.error_description ||
          "ログインできませんでした。"

        );

      }


      const mfaToken =
        data.mfa_token;


      const authenticators =
        await getAuthenticators(
          mfaToken
        );


      const pushAuthenticator =
        authenticators.find(

          item =>

            item.authenticator_type ===
              "oob" &&

            item.oob_channel ===
              "auth0" &&

            item.active

        );


      /*
         Guardian登録済み
      */

      if (
        pushAuthenticator
      ) {


        const challenge =
          await requestPushChallenge(

            mfaToken,

            pushAuthenticator.id

          );


        showAuthStatus(
          "スマホのAuth0 Guardianに通知を送りました。承認してください。"
        );


        await pollGuardian(

          mfaToken,

          challenge.oob_code

        );


        return;

      }


      /*
         Guardian未登録
      */

      if (
        authenticators.length === 0
      ) {


        const association =
          await associateGuardian(
            mfaToken
          );


        showGuardianEnrollment(
          association
        );


        await pollGuardian(

          mfaToken,

          association.oob_code

        );


        return;

      }


      throw new Error(
        "Guardian Pushが登録されていません。"
      );


    } catch (
      error
    ) {


      console.error(
        error
      );


      showAuthError(

        error.message ||
        "認証中にエラーが発生しました。"

      );


    } finally {


      loginButton.disabled =
        false;


    }

  }

);


/* =====================================
   PW変更
   ===================================== */


passwordForm.addEventListener(

  "submit",

  async event => {


    event.preventDefault();


    clearPasswordMessages();


    const first =
      newPassword.value;


    const second =
      newPasswordConfirm.value;


    /*
       確認PW
    */

    if (
      first !== second
    ) {

      showPasswordError(
        "確認用パスワードが一致しません。"
      );

      return;

    }


    /*
       PW条件

       8文字以上
       128文字以下
       半角英字1文字以上
       半角数字1文字以上
    */

    if (
      first.length < 8 ||
      first.length > 128 ||
      !/[A-Za-z]/.test(
        first
      ) ||
      !/[0-9]/.test(
        first
      )
    ) {

      showPasswordError(
        "8文字以上で、半角英字と半角数字をそれぞれ1文字以上含めてください。"
      );

      return;

    }


    const token =
      sessionStorage.getItem(
        "admin_access_token"
      );


    if (
      !token
    ) {

      clearSession();


      showLogin();


      showAuthError(
        "ログイン情報の有効期限が切れました。もう一度ログインしてください。"
      );


      return;

    }


    passwordButton.disabled =
      true;


    showPasswordStatus(
      "パスワードを変更しています…"
    );


    try {


      const response =
        await fetch(

          `${WORKER_URL}/change-password`,

          {

            method:
              "POST",

            headers: {

              "Authorization":
                `Bearer ${token}`,

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify({

                newPassword:
                  first

              })

          }

        );


      const data =
        await readJson(
          response
        );


      if (
        !response.ok
      ) {

        throw new Error(

          data.error ||
          "パスワードを変更できませんでした。"

        );

      }


      newPassword.value =
        "";


      newPasswordConfirm.value =
        "";


      clearSession();


      showLogin();


      clearAuthMessages();


      showAuthStatus(
        "パスワードを変更しました。新しいパスワードで再ログインしてください。"
      );


    } catch (
      error
    ) {


      console.error(
        error
      );


      showPasswordError(

        error.message ||
        "パスワード変更中にエラーが発生しました。"

      );


    } finally {


      passwordButton.disabled =
        false;


    }

  }

);


/* =====================================
   ログアウト
   ===================================== */


logoutButton.addEventListener(

  "click",

  () => {


    pollingStopped =
      true;


    clearSession();


    showLogin();


    adminId.value =
      "";


    adminPassword.value =
      "";


    enrollmentArea.style.display =
      "none";


    clearAuthMessages();


    clearPasswordMessages();


  }

);


/* =====================================
   初期表示
   ===================================== */


restoreSession();


</script>
