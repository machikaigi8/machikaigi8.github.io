<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>
        管理者画面｜みんなのまち会議
    </title>

    <style>

        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;

            min-height: 100vh;

            background-color: #FFFDF7;

            color: #1F1F1F;

            overflow-x: hidden;
        }


        /* =========================
           共通：黄色帯アニメーション
           ========================= */

        @keyframes yellowSlideIn {

            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(0);
            }

        }


        @keyframes headerContentFadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        .top-space,
        .header,
        .subtitle-line {

            animation:
                yellowSlideIn
                0.85s
                cubic-bezier(0.22, 1, 0.36, 1)
                both;
        }


        .title,
        .nav-menu,
        .subtitle {

            opacity: 0;

            animation:
                headerContentFadeIn
                0.5s
                ease-out
                0.85s
                forwards;
        }


        /* =========================
           黄色帯
           ========================= */

        .top-space {

            height: 8px;

            background-color:
                rgba(255, 220, 100, 0.80);

            position: relative;

            z-index: 10;
        }


        .header {

            position: sticky;

            top: 0;

            width: 100%;

            box-sizing: border-box;

            padding:
                18px 34px 12px 34px;

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            background-color:
                rgba(255, 220, 100, 0.80);

            z-index: 100;
        }


        .title {

            margin: 0;

            font-size: 54px;

            line-height: 1;

            font-family:
                "HGP創英ﾌﾟﾚｾﾞﾝｽEB",
                sans-serif;

            color: #001E00;

            white-space: nowrap;
        }


        .title a {

            color: inherit;

            text-decoration: none;
        }


        /* =========================
           ナビ
           ========================= */

        .nav-menu {

            display: flex;

            gap: 30px;

            align-items: center;
        }


        .nav-menu a {

            color: #000000;

            text-decoration: none;

            font-size: 24px;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            white-space: nowrap;

            transition:
                opacity 0.2s;
        }


        .nav-menu a:hover {

            opacity: 0.55;
        }


        /* =========================
           サブタイトル
           ========================= */

        .subtitle-line {

            width: 100%;

            box-sizing: border-box;

            padding:
                0 34px 8px 34px;

            background-color:
                rgba(255, 220, 100, 0.80);

            position: relative;

            z-index: 10;

            clip-path:
                inset(0 0 0 0);
        }


        .subtitle {

            margin: 0;

            font-size: 15px;

            line-height: 1.5;

            color: #003700;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;
        }


        /* =========================
           管理者ページ
           ========================= */

        .admin-main {

            width:
                min(1000px, calc(100% - 48px));

            margin:
                0 auto;

            padding:
                65px 0 100px 0;
        }


        .admin-heading {

            margin:
                0 0 14px 0;

            text-align: center;

            font-size: 42px;

            color: #3F3F3F;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;
        }


        .admin-description {

            margin:
                0 auto 42px auto;

            text-align: center;

            font-size: 16px;

            line-height: 1.8;

            color: #666666;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;
        }


        /* =========================
           認証確認中
           ========================= */

        .auth-loading {

            text-align: center;

            padding:
                55px 0;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;

            color: #555555;
        }


        /* =========================
           ログイン前
           ========================= */

        .login-area {

            text-align: center;

            padding:
                35px 0 60px 0;
        }


        .login-message {

            margin:
                0 0 25px 0;

            font-size: 17px;

            line-height: 1.8;

            color: #444444;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;
        }


        .login-button {

            min-width: 210px;

            padding:
                14px 30px;

            border:
                2px solid #145E20;

            border-radius:
                999px;

            background-color:
                #145E20;

            color:
                #FFFFFF;

            font-size:
                17px;

            font-weight:
                700;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;

            cursor:
                pointer;

            transition:
                background-color 0.2s,
                transform 0.2s;
        }


        .login-button:hover {

            background-color:
                #0F4D19;

            transform:
                translateY(-2px);
        }


        /* =========================
           ログイン後
           ========================= */

        .admin-content {

            display: none;
        }


        .admin-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding-bottom: 18px;

            margin-bottom: 35px;

            border-bottom:
                1px solid #BFBFBF;
        }


        .login-user {

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;

            font-size: 15px;

            color: #555555;
        }


        .login-user strong {

            color: #222222;
        }


        .logout-button {

            padding:
                9px 18px;

            border:
                2px solid #4A4A4A;

            border-radius:
                0;

            background-color:
                transparent;

            color:
                #4A4A4A;

            font-size:
                14px;

            font-weight:
                700;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;

            cursor:
                pointer;

            transition:
                opacity 0.2s;
        }


        .logout-button:hover {

            opacity:
                0.6;
        }


        /* =========================
           管理画面メニュー
           ========================= */

        .admin-menu-title {

            margin:
                0 0 22px 0;

            font-size:
                28px;

            color:
                #145E20;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;
        }


        .admin-menu {

            display:
                grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                22px;
        }


        .admin-menu-item {

            min-height:
                130px;

            box-sizing:
                border-box;

            padding:
                24px;

            border:
                2px solid #D1D1D1;

            background-color:
                rgba(255, 255, 255, 0.45);
        }


        .admin-menu-item h3 {

            margin:
                0 0 10px 0;

            font-size:
                21px;

            color:
                #333333;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;
        }


        .admin-menu-item p {

            margin: 0;

            font-size:
                14px;

            line-height:
                1.7;

            color:
                #666666;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;
        }


        .coming-soon {

            display:
                inline-block;

            margin-top:
                12px;

            font-size:
                12px;

            color:
                #888888;
        }


        /* =========================
           エラー
           ========================= */

        .auth-error {

            display:
                none;

            max-width:
                700px;

            margin:
                30px auto;

            padding:
                18px 20px;

            box-sizing:
                border-box;

            border:
                1px solid #C55B5B;

            color:
                #9E3030;

            background-color:
                #FFF3F3;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;

            font-size:
                14px;

            line-height:
                1.7;
        }


        /* =========================
           スマホ
           ========================= */

        @media (max-width: 768px) {

            .header {

                padding:
                    16px 24px 12px 24px;

                display:
                    block;
            }


            .title {

                font-size:
                    32px;
            }


            .nav-menu {

                margin-top:
                    14px;

                gap:
                    14px;

                flex-wrap:
                    wrap;
            }


            .nav-menu a {

                font-size:
                    12px;
            }


            .subtitle-line {

                padding:
                    0 24px 8px 24px;
            }


            .subtitle {

                font-size:
                    13px;
            }


            .admin-main {

                width:
                    calc(100% - 28px);

                padding:
                    45px 0 70px 0;
            }


            .admin-heading {

                font-size:
                    32px;
            }


            .admin-description {

                font-size:
                    14px;
            }


            .admin-top {

                align-items:
                    flex-start;

                flex-direction:
                    column;
            }


            .admin-menu {

                grid-template-columns:
                    1fr;
            }

        }


        /* =========================
           動きを減らす設定
           ========================= */

        @media (prefers-reduced-motion: reduce) {

            .top-space,
            .header,
            .subtitle-line,
            .title,
            .nav-menu,
            .subtitle {

                animation:
                    none;

                opacity:
                    1;

                transform:
                    none;
            }

        }

    </style>

</head>


<body>


    <div class="top-space"></div>


    <header class="header">

        <h1 class="title">

            <a href="index.html">
                みんなのまち会議
            </a>

        </h1>


        <nav class="nav-menu">

            <a href="news.html">
                ニュース
            </a>

            <a href="about.html">
                まち会議とは
            </a>

            <a href="organization.html">
                団体概要
            </a>

            <a href="contact.html">
                お問い合わせ
            </a>

        </nav>

    </header>


    <div class="subtitle-line">

        <p class="subtitle">
            若者と、はちおうじの街を考える会議
        </p>

    </div>


    <main class="admin-main">


        <h2 class="admin-heading">
            管理者画面
        </h2>


        <p class="admin-description">
            みんなのまち会議 管理者専用ページ
        </p>


        <!-- 認証状態確認中 -->
        <div
            id="auth-loading"
            class="auth-loading"
        >
            認証状態を確認しています…
        </div>


        <!-- エラー -->
        <div
            id="auth-error"
            class="auth-error"
        ></div>


        <!-- ログイン前 -->
        <section
            id="login-area"
            class="login-area"
            hidden
        >

            <p class="login-message">

                管理者アカウントでログインしてください。
                <br>

                ID・パスワード認証後、
                Guardianによる追加認証を行います。

            </p>


            <button
                id="login-button"
                class="login-button"
                type="button"
            >
                管理者ログイン
            </button>

        </section>


        <!-- ログイン後 -->
        <section
            id="admin-content"
            class="admin-content"
        >

            <div class="admin-top">

                <div class="login-user">

                    ログイン中：
                    <strong id="user-email"></strong>

                </div>


                <button
                    id="logout-button"
                    class="logout-button"
                    type="button"
                >
                    ログアウト
                </button>

            </div>


            <h3 class="admin-menu-title">
                管理メニュー
            </h3>


            <div class="admin-menu">


                <div class="admin-menu-item">

                    <h3>
                        お問い合わせ管理
                    </h3>

                    <p>
                        お問い合わせ内容の確認・管理を行います。
                    </p>

                    <span class="coming-soon">
                        ※ 次の工程で作成
                    </span>

                </div>


                <div class="admin-menu-item">

                    <h3>
                        サイト管理
                    </h3>

                    <p>
                        みんなのまち会議のサイト管理機能を追加できます。
                    </p>

                    <span class="coming-soon">
                        ※ 今後追加可能
                    </span>

                </div>


            </div>

        </section>


    </main>


    <!-- Auth0 SPA SDK -->
    <script
        src="https://cdn.auth0.com/js/auth0-spa-js/2.9/auth0-spa-js.production.js"
    ></script>


    <script>

        /* =====================================
           Auth0設定
           ===================================== */

        const AUTH0_DOMAIN =
            "dev-8e2z74rs10plmrtk.us.auth0.com";


        const AUTH0_CLIENT_ID =
            "vKm2kK5RZyra8FlRWDTFDK04AoCznwsc";


        const ADMIN_URL =
            "https://machikaigi8.github.io/admin.html";


        const HOME_URL =
            "https://machikaigi8.github.io/";


        let auth0Client;


        /* =====================================
           HTML要素
           ===================================== */

        const authLoading =
            document.getElementById(
                "auth-loading"
            );


        const authError =
            document.getElementById(
                "auth-error"
            );


        const loginArea =
            document.getElementById(
                "login-area"
            );


        const adminContent =
            document.getElementById(
                "admin-content"
            );


        const loginButton =
            document.getElementById(
                "login-button"
            );


        const logoutButton =
            document.getElementById(
                "logout-button"
            );


        const userEmail =
            document.getElementById(
                "user-email"
            );


        const header =
            document.querySelector(
                ".header"
            );


        const subtitleLine =
            document.querySelector(
                ".subtitle-line"
            );


        /* =====================================
           Auth0 初期化
           ===================================== */

        async function initializeAuth() {

            try {

                auth0Client =
                    await auth0.createAuth0Client({

                        domain:
                            AUTH0_DOMAIN,

                        clientId:
                            AUTH0_CLIENT_ID,

                        authorizationParams: {

                            redirect_uri:
                                ADMIN_URL

                        }

                    });


                const query =
                    window.location.search;


                /*
                   Auth0からログイン後に
                   admin.htmlへ戻ってきた場合
                */
                if (
                    query.includes("code=")
                    &&
                    query.includes("state=")
                ) {

                    await auth0Client
                        .handleRedirectCallback();


                    window.history.replaceState(
                        {},
                        document.title,
                        ADMIN_URL
                    );

                }


                /*
                   Auth0側でエラーが起きた場合
                */
                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                if (
                    params.has("error")
                ) {

                    throw new Error(

                        params.get(
                            "error_description"
                        )
                        ||
                        params.get(
                            "error"
                        )

                    );

                }


                await updateAuthScreen();

            } catch (error) {

                console.error(
                    "Auth0 error:",
                    error
                );


                authLoading.style.display =
                    "none";


                loginArea.hidden =
                    false;


                authError.style.display =
                    "block";


                authError.textContent =
                    "認証処理でエラーが発生しました："
                    +
                    error.message;

            }

        }


        /* =====================================
           ログイン状態による画面切り替え
           ===================================== */

        async function updateAuthScreen() {

            const isAuthenticated =
                await auth0Client
                    .isAuthenticated();


            authLoading.style.display =
                "none";


            if (isAuthenticated) {

                const user =
                    await auth0Client
                        .getUser();


                loginArea.hidden =
                    true;


                adminContent.style.display =
                    "block";


                userEmail.textContent =
                    user.email
                    ||
                    user.name
                    ||
                    "管理者";


            } else {

                loginArea.hidden =
                    false;


                adminContent.style.display =
                    "none";

            }

        }


        /* =====================================
           ログイン
           ===================================== */

        loginButton.addEventListener(
            "click",
            async () => {

                try {

                    await auth0Client
                        .loginWithRedirect({

                            authorizationParams: {

                                redirect_uri:
                                    ADMIN_URL

                            }

                        });

                } catch (error) {

                    authError.style.display =
                        "block";


                    authError.textContent =
                        "ログインを開始できませんでした："
                        +
                        error.message;

                }

            }
        );


        /* =====================================
           ログアウト
           ===================================== */

        logoutButton.addEventListener(
            "click",
            () => {

                auth0Client.logout({

                    logoutParams: {

                        returnTo:
                            HOME_URL

                    }

                });

            }
        );


        /* =====================================
           黄色帯の重なり防止
           ===================================== */

        function clipUnderHeader(element) {

            const headerBottom =
                header
                    .getBoundingClientRect()
                    .bottom;


            const elementTop =
                element
                    .getBoundingClientRect()
                    .top;


            const elementHeight =
                element.offsetHeight;


            const overlap =
                Math.max(
                    0,
                    headerBottom
                    -
                    elementTop
                );


            const clipAmount =
                Math.min(
                    overlap,
                    elementHeight
                );


            element.style.clipPath =
                `inset(${clipAmount}px 0 0 0)`;

        }


        function updateLayout() {

            clipUnderHeader(
                subtitleLine
            );

        }


        window.addEventListener(
            "scroll",
            updateLayout
        );


        window.addEventListener(
            "resize",
            updateLayout
        );


        updateLayout();


        /* Auth0起動 */
        initializeAuth();

    </script>


</body>

</html>
