<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理者画面｜みんなのまち会議</title>

<style>
:root{
  --navy:#203A5F;
  --bg:#EEF1F5;
  --panel:#F7F9FC;
  --text:#1F2F46;
  --muted:#52637A;
  --danger:#8A2E2E;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Yu Gothic","Meiryo",sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

.hidden{
  display:none!important;
}

.page{
  width:min(900px,calc(100% - 30px));
  margin:auto;
  padding:28px 0 70px;
}

.topbar{
  display:none;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.top-actions{
  display:flex;
  gap:10px;
}

.title{
  text-align:center;
  color:var(--navy);
  font-size:40px;
  margin:0 0 10px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin:0 0 32px;
}

.panel,
.card{
  background:var(--panel);
  border:2px solid var(--navy);
  padding:28px;
}

.section-title{
  text-align:center;
  color:var(--navy);
  margin:0 0 24px;
}

.form{
  width:min(570px,100%);
  margin:auto;
}

.form-two-column{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.form-two-column .row{
  margin-bottom:20px;
}

.required-mark{
  display:none;
  margin-left:6px;
  color:var(--danger);
  font-size:12px;
  font-weight:700;
}

.required-mark.active{
  display:inline;
}

.login-method-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  width:min(650px,100%);
  margin:18px auto 0;
}

.login-method{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  min-height:160px;
  padding:18px 10px;
  border:2px solid var(--navy);
  border-radius:0;
  background:white;
  color:var(--navy);
  font-weight:700;
  text-align:center;
  cursor:pointer;
}

.login-method:hover,
.login-method:focus-visible{
  background:#E8EEF6;
}

.login-method-icon{
  width:86px;
  height:86px;
  object-fit:cover;
  display:block;
}

.login-method-name{
  font-size:16px;
  line-height:1.35;
}

.create-method-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.create-method{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:120px;
  padding:12px 8px;
  border:1px solid #9AA9BC;
  background:white;
  text-align:center;
  cursor:pointer;
}

.create-method img{
  width:54px;
  height:54px;
  object-fit:cover;
}

.create-method input{
  margin:0 0 2px;
}

.selected-id{
  width:min(570px,100%);
  margin:0 auto 18px;
  padding:10px 12px;
  border-left:4px solid var(--navy);
  background:#E8EEF6;
  color:var(--text);
  word-break:break-all;
}

.row{
  margin-bottom:20px;
}

.label{
  display:block;
  font-weight:700;
  color:var(--navy);
  margin-bottom:8px;
}

.input,
.textarea{
  width:100%;
  border:2px solid var(--navy);
  border-radius:0;
  background:white;
  padding:11px 13px;
}

.textarea{
  min-height:150px;
  resize:vertical;
}

.hint{
  font-size:13px;
  line-height:1.7;
  color:var(--muted);
}

.button,
.sub,
.menu{
  border-radius:0;
  font-weight:700;
  cursor:pointer;
}

.button{
  display:block;
  margin:25px auto 0;
  padding:11px 24px;
  border:2px solid var(--navy);
  background:var(--navy);
  color:white;
}

.sub{
  padding:9px 15px;
  border:2px solid var(--navy);
  background:transparent;
  color:var(--navy);
}

button:disabled,
input:disabled,
textarea:disabled{
  opacity:.48;
  cursor:not-allowed;
}

.status,
.error{
  display:none;
  width:min(620px,100%);
  margin:20px auto 0;
  padding:13px 15px;
  line-height:1.7;
}

.status{
  border:2px solid #617A99;
  background:#EDF3FA;
  color:var(--navy);
}

.error{
  border:2px solid #A05050;
  background:#FFF3F3;
  color:var(--danger);
}

.admin{
  display:none;
  margin-top:65px;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.menu{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  min-height:78px;
  padding:18px;
  border:2px solid var(--navy);
  background:var(--panel);
  color:var(--navy);
  text-align:left;
}

.back{
  margin-bottom:18px;
}

.mfa-options,
.create-options{
  display:grid;
  gap:10px;
}

.mfa-box,
.create-option{
  border:1px solid #9AA9BC;
  background:white;
  padding:12px;
}

.choice{
  display:flex;
  gap:8px;
  align-items:center;
}

.qr{
  width:220px;
  min-height:220px;
  margin:15px auto;
  padding:10px;
  border:2px solid var(--navy);
  background:#fff;
}

.code-area,
.enroll-area,
.account-verify{
  display:none;
  margin-top:24px;
  padding-top:22px;
  border-top:1px solid #AAB5C4;
}

.table-wrap{
  overflow:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

.table th,
.table td{
  border:1px solid #A0ACBC;
  padding:11px;
}

.table th{
  background:#E8EEF6;
  color:var(--navy);
}

.edit-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.mini{
  padding:7px 11px;
  border:2px solid var(--navy);
  background:white;
  color:var(--navy);
  font-weight:700;
}

.mini.save{
  background:var(--navy);
  color:white;
}

.request-list{
  display:grid;
  gap:14px;
}

.request-card{
  border:1px solid #A0ACBC;
  background:white;
  padding:16px;
}

.request-answer{
  margin-top:12px;
  padding:12px;
  border-left:4px solid var(--navy);
  background:#EDF3FA;
  white-space:pre-wrap;
}

.result{
  display:none;
  margin-top:20px;
  border:2px solid var(--navy);
  background:white;
  padding:18px;
}

.code{
  padding:9px;
  background:#F1F4F8;
  border:1px solid #A0ACBC;
  font-family:Consolas,monospace;
  word-break:break-all;
}

@media(max-width:700px){
  .title{
    font-size:31px;
  }

  .panel,
  .card{
    padding:20px 16px;
  }

  .menu-grid{
    grid-template-columns:1fr;
  }

  .form-two-column{
    grid-template-columns:1fr;
    gap:0;
  }

  .login-method-grid,
  .create-method-grid{
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }

  .login-method{
    min-height:132px;
    padding:12px 5px;
  }

  .login-method-icon{
    width:62px;
    height:62px;
  }

  .login-method-name{
    font-size:13px;
  }

  .create-method{
    min-height:108px;
    font-size:12px;
  }

  .create-method img{
    width:46px;
    height:46px;
  }
}
</style>
</head>

<body>

<main class="page">

  <div id="topbar" class="topbar">
    <strong id="user-name"></strong>

    <div class="top-actions">
      <button id="refresh" class="sub">
        ↻ 更新
      </button>

      <button id="logout" class="sub">
        ログアウト
      </button>
    </div>
  </div>

  <h1 id="page-title" class="title">
    管理者画面
  </h1>

  <p id="subtitle" class="subtitle">
    みんなのまち会議 管理者専用ページ
  </p>

  <section id="login-section" class="panel">

    <div id="login-main">

      <h2 class="section-title">
        ログイン
      </h2>

      <form id="login-id-form" class="form">

        <div class="row">
          <label class="label" for="admin-id">
            ID
          </label>

          <input
            id="admin-id"
            class="input"
            autocomplete="username"
            required
          >
        </div>

        <button
          id="login-id-button"
          class="button"
        >
          次へ
        </button>

      </form>

    </div>

    <div id="login-method" class="hidden">

      <h2 class="section-title">
        ログイン方法
      </h2>

      <div class="selected-id">
        ID：
        <strong id="login-selected-id"></strong>
      </div>

      <div class="login-method-grid">

        <button
          id="login-passkey"
          class="login-method"
          type="button"
        >
          <img
            class="login-method-icon"
            src="passkey.webp"
            alt="Passkey"
          >
          <span class="login-method-name">Passkey</span>
        </button>

        <button
          id="login-email"
          class="login-method"
          type="button"
        >
          <img
            class="login-method-icon"
            src="mail.png"
            alt="メール認証"
          >
          <span class="login-method-name">メール認証</span>
        </button>

        <button
          id="login-app"
          class="login-method"
          type="button"
        >
          <img
            class="login-method-icon"
            src="guardian.jpg"
            alt="アプリ認証"
          >
          <span class="login-method-name">アプリ認証</span>
        </button>

      </div>

      <button
        id="login-method-back"
        class="sub"
        type="button"
        style="margin-top:22px"
      >
        ← ID入力へ戻る
      </button>

    </div>

    <div id="login-password" class="hidden">

      <h2
        id="login-password-title"
        class="section-title"
      >
        パスワード確認
      </h2>

      <div class="selected-id">
        ID：
        <strong id="login-password-id"></strong>
      </div>

      <form id="login-password-form" class="form">

        <div class="row">
          <label class="label" for="admin-password">
            パスワード
          </label>

          <input
            id="admin-password"
            class="input"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          id="login-password-button"
          class="button"
        >
          パスワードを確認
        </button>

      </form>

      <button
        id="login-password-back"
        class="sub"
        type="button"
        style="margin-top:22px"
      >
        ← ログイン方法へ戻る
      </button>

    </div>

    <div id="login-mfa" class="hidden">

      <h2 class="section-title">
        認証
      </h2>

      <div class="form">
        <p
          id="login-mfa-message"
          class="hint"
        ></p>
      </div>

      <div
        id="login-enroll"
        class="enroll-area"
      >

        <p class="hint">
          Auth0 GuardianアプリでQRコードを読み取り、承認してください。
        </p>

        <div
          id="login-qr"
          class="qr"
        ></div>

      </div>

      <div
        id="login-code-area"
        class="code-area"
      >

        <form
          id="login-code-form"
          class="form"
        >

          <p
            id="login-code-message"
            class="hint"
          ></p>

          <div class="row">

            <label
              class="label"
              for="login-code"
            >
              認証コード
            </label>

            <input
              id="login-code"
              class="input"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="10"
              required
            >

          </div>

          <button
            id="login-code-button"
            class="button"
          >
            認証する
          </button>

        </form>

      </div>

      <button
        id="login-back"
        class="sub"
        type="button"
        style="margin-top:22px"
      >
        ← ログイン方法へ戻る
      </button>

    </div>

    <div
      id="auth-status"
      class="status"
    ></div>

    <div
      id="auth-error"
      class="error"
    ></div>

  </section>

  <section
    id="admin"
    class="admin"
  >

    <section
      id="view-home"
      class="view active"
    >

      <div class="menu-grid">

        <button
          class="menu"
          data-view="meeting"
        >
          <span>次回まち会議日時設定</span>
          <span>›</span>
        </button>

        <button
          class="menu"
          data-view="news"
        >
          <span>ニュース追加</span>
          <span>›</span>
        </button>

        <button
          class="menu"
          data-view="password"
        >
          <span>パスワード変更</span>
          <span>›</span>
        </button>

        <button
          class="menu"
          data-view="inquiries"
        >
          <span>お問い合わせ一覧</span>
          <span>›</span>
        </button>

        <button
          class="menu"
          data-view="developer-request"
        >
          <span>デベロッパーへの要望</span>
          <span>›</span>
        </button>

        <button
          id="hp-home"
          class="menu hidden"
          data-view="hp-update"
        >
          <span>HP更新</span>
          <span>›</span>
        </button>

        <button
          id="developer-home"
          class="menu hidden"
          data-view="developer"
        >
          <span>デベロッパーメニュー</span>
          <span>›</span>
        </button>

      </div>

    </section>

    <section
      id="view-meeting"
      class="view"
    >

      <button
        class="sub back"
        data-home
      >
        ← 管理者トップへ戻る
      </button>

      <div class="card">

        <form
          id="meeting-form"
          class="form"
        >

          <div class="row">
            <label class="label">
              開催日
            </label>

            <input
              class="input"
              type="date"
              required
            >
          </div>

          <div class="row">
            <label class="label">
              開始時間
            </label>

            <input
              class="input"
              type="time"
              required
            >
          </div>

          <div class="row">
            <label class="label">
              終了時間
            </label>

            <input
              class="input"
              type="time"
            >
          </div>

          <div class="row">
            <label class="label">
              会場
            </label>

            <input class="input">
          </div>

          <div class="row">
            <label class="label">
              備考
            </label>

            <textarea class="textarea"></textarea>
          </div>

          <button
            id="meeting-save"
            class="button"
          >
            保存
          </button>

        </form>

        <div
          id="meeting-status"
          class="status"
        ></div>

      </div>

    </section>

    <section
      id="view-news"
      class="view"
    >

      <button
        class="sub back"
        data-home
      >
        ← 管理者トップへ戻る
      </button>

      <div class="card">

        <form
          id="news-form"
          class="form"
        >

          <div class="row">
            <label class="label">
              タイトル
            </label>

            <input
              class="input"
              required
            >
          </div>

          <div class="row">
            <label class="label">
              公開日
            </label>

            <input
              class="input"
              type="date"
              required
            >
          </div>

          <div class="row">
            <label class="label">
              本文
            </label>

            <textarea
              class="textarea"
              required
            ></textarea>
          </div>

          <button
            id="news-add"
            class="button"
          >
            追加
          </button>

        </form>

        <div
          id="news-status"
          class="status"
        ></div>

      </div>

    </section>

    <section
      id="view-password"
      class="view"
    >

      <button
        class="sub back"
        data-home
      >
        ← 管理者トップへ戻る
      </button>

      <div class="card">

        <form
          id="password-form"
          class="form"
        >

          <p class="hint">
            8文字以上、半角英字と半角数字を含めてください。
          </p>

          <div class="row">

            <label class="label">
              新しいパスワード
            </label>

            <input
              id="new-password"
              class="input"
              type="password"
              required
            >

          </div>

          <div class="row">

            <label class="label">
              新しいパスワード（確認）
            </label>

            <input
              id="new-password-confirm"
              class="input"
              type="password"
              required
            >

          </div>

          <button
            id="password-button"
            class="button"
          >
            パスワードを変更
          </button>

        </form>

        <div
          id="password-status"
          class="status"
        ></div>

        <div
          id="password-error"
          class="error"
        ></div>

      </div>

    </section>

    <section
      id="view-inquiries"
      class="view"
    >

      <button
        class="sub back"
        data-home
      >
        ← 管理者トップへ戻る
      </button>

      <div class="card">

        <p class="hint">
          現在のお問い合わせフォームはメール送信方式です。
          一覧表示には保存先の接続が必要です。
        </p>

      </div>

    </section>

    <section
      id="view-developer-request"
      class="view"
    >

      <button
        class="sub back"
        data-home
      >
        ← 管理者トップへ戻る
      </button>

      <div class="card">

        <form
          id="request-form"
          class="form"
        >

          <div class="row">

            <label class="label">
              件名
            </label>

            <input
              id="request-subject"
              class="input"
              maxlength="120"
              required
            >

          </div>

          <div class="row">

            <label class="label">
              要望内容
            </label>

            <textarea
              id="request-body"
              class="textarea"
              maxlength="4000"
              required
            ></textarea>

          </div>

          <button
            id="request-send"
            class="button"
          >
            送信
          </button>

        </form>

        <div
          id="request-status"
          class="status"
        ></div>

        <h3>
          送信した要望・回答
        </h3>

        <div
          id="my-requests-status"
          class="hint"
        >
          読み込み中...
        </div>

        <div
          id="my-requests"
          class="request-list"
        ></div>

      </div>

    </section>

    <section
      id="view-developer"
      class="view"
    >

      <button
        class="sub back"
        data-home
      >
        ← 管理者トップへ戻る
      </button>

      <div class="card">

        <div class="menu-grid">

          <button
            class="menu"
            data-view="hp-update"
          >
            <span>HP更新</span>
            <span>›</span>
          </button>

          <button
            class="menu"
            data-view="developer-responses"
          >
            <span>デベロッパーへの要望の回答</span>
            <span>›</span>
          </button>

          <button
            class="menu"
            data-view="admin-users"
          >
            <span>アカウント一覧</span>
            <span>›</span>
          </button>

          <button
            class="menu"
            data-view="create-admin"
          >
            <span>アカウント作成</span>
            <span>›</span>
          </button>

        </div>

      </div>

    </section>

    <section
      id="view-developer-responses"
      class="view"
    >

      <button
        class="sub back"
        data-view="developer"
      >
        ← デベロッパーメニューへ戻る
      </button>

      <div class="card">

        <div
          id="all-requests-status"
          class="hint"
        >
          読み込み中...
        </div>

        <div
          id="all-requests"
          class="request-list"
        ></div>

      </div>

    </section>

    <section
      id="view-admin-users"
      class="view"
    >

      <button
        class="sub back"
        data-view="developer"
      >
        ← デベロッパーメニューへ戻る
      </button>

      <div class="card">

        <div
          id="users-status"
          class="hint"
        >
          読み込み中...
        </div>

        <div class="table-wrap">

          <table class="table">

            <thead>
              <tr>
                <th>名前</th>
                <th>ID</th>
                <th>共同管理者モード</th>
                <th>編集</th>
              </tr>
            </thead>

            <tbody id="users-body"></tbody>

          </table>

        </div>

      </div>

    </section>

    <section
      id="view-hp-update"
      class="view"
    >

      <button
        class="sub back"
        data-home
      >
        ← 管理者トップへ戻る

async function readJson(
  response
) {
  const text =
    await response.text();

  if (!text) {
    return {};
  }

  try {
    return JSON.parse(
      text
    );
  } catch {
    return {
      error_description:
        text,
    };
  }
}

function decodeJwt(
  token
) {
  try {
    let payload =
      token
        .split(".")[1]
        .replace(
          /-/g,
          "+"
        )
        .replace(
          /_/g,
          "/"
        );

    payload +=
      "=".repeat(
        (
          4 -
          payload.length %
            4
        ) %
          4
      );

    return JSON.parse(
      new TextDecoder()
        .decode(
          Uint8Array.from(
            atob(
              payload
            ),
            character =>
              character
                .charCodeAt(0)
          )
        )
    );
  } catch {
    return {};
  }
}

async function passwordLogin(
  username,
  password
) {
  const body =
    new URLSearchParams({
      grant_type:
        "http://auth0.com/oauth/grant-type/password-realm",

      client_id:
        AUTH0_CLIENT_ID,

      username,

      password,

      realm:
        AUTH0_REALM,

      audience:
        API_AUDIENCE,

      scope:
        "openid profile",
    });

  const response =
    await fetch(
      `${AUTH0_BASE}/oauth/token`,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded",
        },

        body,
      }
    );

  return {
    response,

    data:
      await readJson(
        response
      ),
  };
}

async function workerPost(
  path,
  body = {},
  token = ""
) {
  const headers = {
    "Content-Type":
      "application/json",
  };

  if (token) {
    headers.Authorization =
      `Bearer ${token}`;
  }

  let response;

  try {
    response =
      await fetch(
        `${WORKER_URL}${path}`,
        {
          method:
            "POST",

          headers,

          body:
            JSON.stringify(
              body
            ),
        }
      );
  } catch (
    error
  ) {
    console.error(
      error
    );

    throw new Error(
      `管理APIに接続できませんでした。Worker URL: ${WORKER_URL}`
    );
  }

  return {
    response,

    data:
      await readJson(
        response
      ),
  };
}

function authKind(
  authenticator
) {
  if (
    authenticator.authenticator_type !==
    "oob"
  ) {
    return "";
  }

  if (
    authenticator.oob_channel ===
    "auth0"
  ) {
    return "app";
  }

  if (
    authenticator.oob_channel ===
    "email"
  ) {
    return "email";
  }

  return "";
}

async function startSelectedLoginMfa(
  token,
  authenticators,
  method
) {
  loginMfaToken =
    token;

  loginAuthenticators =
    authenticators.filter(
      authenticator =>
        authenticator.active &&
        authKind(
          authenticator
        )
    );

  ui.loginPassword

    "";

  ui.loginMfaMessage.textContent =
    method === "email"
      ? "メール認証を行います。"
      : "アプリ認証を行います。";

  const matches =
    loginAuthenticators.filter(
      authenticator =>
        authKind(
          authenticator
        ) ===
        method
    );

  if (
    method === "app" &&
    matches.length === 0
  ) {
    const assoc =
      await associateMfa(
        loginMfaToken,
        "auth0"
      );

    if (
      !assoc.barcode_uri
    ) {
      throw new Error(
        "認証アプリ登録用のQRコードを取得できませんでした。"
      );
    }

    new QRCode(

      }
    );

      "block";

    ui.loginMfaMessage.textContent =
      "認証アプリを登録して承認してください。";

    authStatus(
      "Auth0 GuardianアプリでQRコードを読み取り、承認してください。"
    );

    await pollGuardian(
      loginMfaToken,
      assoc.oob_code,

    );

    return;
  }

  const authenticator =
    matches[0];

  if (

  ) {
    throw new Error(
      method === "email"
        ? "このアカウントにはメール認証が登録されていません。"
        : "このアカウントにはアプリ認証が登録されていません。"
    );
  }

  const challenge =
    await challengeMfa(
      loginMfaToken,
      authenticator.id
    );

  if (
    authenticator.oob_channel ===
    "auth0"
  ) {
    ui.loginMfaMessage.textContent =
      "認証アプリに通知を送信しました。承認してください。";

      "Auth0 Guardianへ通知しました。承認してください。"
    );

    await pollGuardian(
      loginMfaToken,
      challenge.oob_code,
      false
    );

    return;
  }

  showCode(
    loginMfaToken,
    challenge.oob_code,
    authenticator.oob_channel
  );

  authStatus(
    "メールへ認証コードを送信しました。"
  );
}

async function pollGuardian(
  token,
  oob,
  accountMode =
    false
) {
  let wait =
    5000;

  if (
    accountMode
  ) {
    accountStop =
      false;
  } else {
    guardianStop =
      false;
  }

  for (
    let i = 0;
    i < 30;
    i++
  ) {
    if (
      accountMode
        ? accountStop
        : guardianStop
    ) {
      return;
    }

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          wait
        )
    );

    const {
      response,
      data,
    } =
      await verifyMfa(
        token,
        oob
      );

    if (
      response.ok &&
      data.access_token
    ) {
      if (
        accountMode
      ) {
        await completeAccountFactor(
          data.access_token
        );
      } else {
        finishLogin(
          data
        );
      }

      return;
    }

    if (
      data.error ===
      "authorization_pending"
    ) {
      continue;
    }

    if (
      data.error ===
      "slow_down"
    ) {
      wait =
        Math.min(
          wait + 2000,
          10000
        );

      continue;
    }

    throw new Error(
      data.error_description ||
      data.error ||
      "認証を完了できませんでした。"
    );
  }

  throw new Error(
    "認証待ちがタイムアウトしました。"
  );
}

        throw new Error(
          data.error_description ||
          "ログインできませんでした。"

        data.mfa_token,
        await listAuthenticators(
          data.mfa_token

        selectedLoginMethod
      );

      error
    ) {

        ui.loginPassword

function restore() {
  const token =
    sessionStorage.getItem(
      "admin_access_token"
    );

  const expires =
    Number(
      sessionStorage.getItem(
        "admin_expires_at"
      ) ||
      0

}

async function finishPasskeyLogin() {
  const token =
    await auth0Client.getTokenSilently({
      detailedResponse:
        true,
    });

  const user =
    await auth0Client.getUser();

  if (
    !token?.access_token ||
    !user?.sub
  ) {
    throw new Error(
      "Passkey認証後のログイン情報を取得できませんでした。"
    );
  }

  const accessPayload =
    decodeJwt(
      token.access_token
    );

  const expiresAt =
    accessPayload.exp
      ? Number(
          accessPayload.exp
        ) *
        1000
      : Date.now() +
        Number(
          token.expires_in ||
          600
        ) *
        1000;

  sessionStorage.setItem(
    "admin_access_token",
    token.access_token
  );

  sessionStorage.setItem(
    "admin_expires_at",
    String(
      expiresAt
    )
  );

  sessionStorage.setItem(
    "admin_username",
    user.name ||
      user.nickname ||
      sessionStorage.getItem(
        "pending_admin_id"
      ) ||
      "管理者"
  );

  sessionStorage.setItem(
    "admin_sub",
    user.sub
  );

  sessionStorage.setItem(
    "admin_current_view",
    "home"
  );

  sessionStorage.setItem(
    "admin_auth_mode",
    "passkey"
  );

  sessionStorage.removeItem(
    "pending_admin_id"
  );

  showAdmin();
}

async function initAuth() {
  try {
    auth0Client =
      await auth0.createAuth0Client({
        domain:
          AUTH0_DOMAIN,

        clientId:
          AUTH0_CLIENT_ID,

        authorizationParams: {
          audience:
            API_AUDIENCE,

          scope:
            "openid profile",

          redirect_uri:
            AUTH0_REDIRECT_URI,
        },
      });

    const params =
      new URLSearchParams(
        window.location.search
      );

    if (
      params.has(
        "code"
      ) &&
      params.has(
        "state"
      )
    ) {
      await auth0Client.handleRedirectCallback();

      window.history.replaceState(
        {},
        document.title,
        `${window.location.pathname}${window.location.hash}`
      );

      await finishPasskeyLogin();

      return;
    }

    if (
      params.has(
        "error"
      )
    ) {
      const description =
        params.get(
          "error_description"
        ) ||
        params.get(
          "error"
        ) ||
        "Passkey認証を完了できませんでした。";

      window.history.replaceState(
        {},
        document.title,
        `${window.location.pathname}${window.location.hash}`
      );

      showLogin();

      authError(
        description
      );

      return;
    }

    restore();
  } catch (
    error
  ) {
    console.error(
      error
    );

    showLogin();

    authError(
      error.message ||
      "認証機能を初期化できませんでした。"
    );
  }
}

function formatDate(
  value
) {
  if (!value) {
    return "";
  }

  const date =
    new Date(
      value.endsWith(
        "Z"
      )
        ? value
        : value + "Z"
    );

  return Number.isNaN(
    date.getTime()
  )
    ? value
    : new Intl.DateTimeFormat(
        "ja-JP",
        {
          dateStyle:
            "medium",

          timeStyle:
            "short",

          timeZone:
            "Asia/Tokyo",
        }
      ).format(
        date
      );
}

function requestCard(
  item,
  owner
) {
  const card =
    document.createElement(
      "article"
    );

  card.className =
    "request-card";

  const heading =
    document.createElement(
      "h3"
    );

  heading.textContent =
    item.subject ||
    "（件名なし）";

  card.append(
    heading
  );

  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "hint";

  meta.textContent =
    owner
      ? `${item.requesterName || "—"} / ${item.requesterUsername || "—"}　${formatDate(item.createdAt)}`
      : `送信日時：${formatDate(item.createdAt)}`;

  card.append(
    meta
  );

  const body =
    document.createElement(
      "div"
    );

  body.style.whiteSpace =
    "pre-wrap";

  body.textContent =
    item.body ||
    "";

  card.append(
    body
  );

  if (
    owner
  ) {
    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.className =
      "textarea";

    textarea.value =
      item.response ||
      "";

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "button";

    button.type =
      "button";

    button.textContent =
      item.response
        ? "回答を更新"
        : "回答を保存";

    button.addEventListener(
      "click",
      async () => {
        if (
          !textarea.value.trim()
        ) {
          return alert(
            "回答を入力してください。"
          );
        }

        button.disabled =
          true;

        try {
          const {
            response,
            data,
          } =
            await workerPost(
              "/developer-request-answer",
              {
                id:
                  item.id,

                response:
                  textarea.value.trim(),
              },
              sessionStorage.getItem(
                "admin_access_token"
              )
            );

          if (
            !response.ok
          ) {
            throw new Error(
              data.error ||
              "回答を保存できませんでした。"
            );
          }

          await loadAllRequests();
        } catch (
          error
        ) {
          alert(
            error.message
          );
        } finally {
          button.disabled =
            false;
        }
      }
    );

    card.append(
      textarea,
      button
    );
  } else {
    const answer =
      document.createElement(
        "div"
      );

    answer.className =
      "request-answer";

    answer.textContent =
      item.response
        ? `回答\n${item.response}`
        : "回答待ち";

    card.append(
      answer
    );
  }

  return card;
}

        const check =
          document.createElement(
            "input"
          );

        check.type =
          "checkbox";

        check.checked =
          !!user.coAdmin;

        check.disabled =
          true;

        mode.append(
          check
        );

        if (
          user.isOwner
        ) {
          mode.textContent =
            "—";

          edit.textContent =
            "—";
        } else {
          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "edit-actions";

          const editButton =
            document.createElement(
              "button"
            );

          editButton.className =
            "mini";

          editButton.textContent =
            "編集";

          editButton.disabled =
            !!user.isDummy;

          const save =
            document.createElement(
              "button"
            );

          save.className =
            "mini save hidden";

          save.textContent =
            "保存";

          const cancel =
            document.createElement(
              "button"
            );

          cancel.className =
            "mini hidden";

          cancel.textContent =
            "キャンセル";

          let original =
            !!user.coAdmin;

          editButton.addEventListener(
            "click",
            () => {
              original =
                !!user.coAdmin;

              check.disabled =
                false;

              editButton
                .classList
                .add(
                  "hidden"
                );

              save
                .classList
                .remove(
                  "hidden"
                );

              cancel
                .classList
                .remove(
                  "hidden"
                );
            }
          );

          cancel.addEventListener(
            "click",
            () => {
              check.checked =
                original;

              check.disabled =
                true;

              save
                .classList
                .add(
                  "hidden"
                );

              cancel
                .classList
                .add(
                  "hidden"
                );

              editButton
                .classList
                .remove(
                  "hidden"
                );
            }
          );

          save.addEventListener(
            "click",
            async () => {
              save.disabled =
                true;

              try {
                const {
                  response,
                  data,
                } =
                  await workerPost(
                    "/set-co-admin",
                    {
                      userId:
                        user.userId,

                      enabled:
                        check.checked,
                    },
                    sessionStorage.getItem(
                      "admin_access_token"
                    )
                  );

                if (
                  !response.ok
                ) {
                  throw new Error(
                    data.error ||
                    "変更できませんでした。"
                  );
                }

                user.coAdmin =
                  check.checked;

                original =
                  check.checked;

                check.disabled =
                  true;

                save
                  .classList
                  .add(
                    "hidden"
                  );

                cancel
                  .classList
                  .add(
                    "hidden"
                  );

                editButton
                  .classList
                  .remove(
                    "hidden"
                  );
              } catch (
                error
              ) {
                check.checked =
                  original;

                alert(
                  error.message
                );
              } finally {
                save.disabled =
                  false;
              }
            }
          );

          actions.append(
            editButton,
            save,
            cancel
          );

          edit.append(
            actions
          );
        }

        row.append(
          name,
          id,
          mode,
          edit
        );

        ui.usersBody.append(
          row
        );
      }
    );
  } catch (
    error
  ) {
    ui.usersStatus.textContent =
      error.message;
  }
}

function selectedCreateMethods() {
  const methods =
    [];

  if (
    ui.createPasskey.checked
  ) {
    methods.push(
      "passkey"
    );
  }

  if (
    ui.createEmailCheck.checked
  ) {
    methods.push(
      "email"
    );
  }

  if (
    ui.createApp.checked
  ) {
    methods.push(
      "app"
    );
  }

  return methods;
}

function updateCreateRequirements() {
  const methods =
    selectedCreateMethods();

  const emailRequired =
    methods.includes(
      "passkey"
    ) ||
    methods.includes(
      "email"
    );

  ui.createEmail.required =
    emailRequired;

  ui.createEmailRequired
    .classList
    .toggle(
      "active",
      emailRequired
    );
}

[
  ui.createPasskey,
  ui.createEmailCheck,
  ui.createApp,
].forEach(
  element =>
    element.addEventListener(
      "change",
      updateCreateRequirements
    )
);

updateCreateRequirements();

function setCreateDisabled(
  value
) {
  ui.createForm
    .querySelectorAll(
      "input,button"
    )
    .forEach(
      element =>
        element.disabled =
          value
    );
}

function resetAccountVerification() {
  accountStop =
    true;

  pendingAccount =
    null;

  hide(
    ui.accountVerify
  );

  ui.accountProgress.textContent =
    "";

  ui.accountMessage.textContent =
    "";

  ui.accountQr
    .classList
    .add(
      "hidden"
    );

  ui.accountQr.innerHTML =
    "";

  ui.accountCodeForm
    .classList
    .add(
      "hidden"
    );

  ui.accountCode.value =
    "";
}

function updateProgress() {
  if (
    !pendingAccount
  ) {
    return;
  }

  const done =
    new Set(
      pendingAccount
        .verifiedMethods ||
      []
    );

  const current =
    pendingAccount
      .mfaMethods[
        pendingAccount
          .currentIndex
      ] ||
    "";

  ui.accountProgress.textContent =
    pendingAccount
      .mfaMethods
      .map(
        method =>
          `${
            done.has(
              method
            )
              ? "✓"
              : method ===
                  current
                ? "●"
                : "○"
          } ${methodLabel(method)}`
      )
      .join(
        "　"
      );
}

async function prepareAccountFactor() {
  const account =
    pendingAccount;

  if (
    !account
  ) {
    return;
  }

  if (
    account.currentIndex >=
    account.mfaMethods.length
  ) {
    return finalizeAccount();
  }

  const method =
    account.mfaMethods[
      account.currentIndex
    ];

  account.currentMethod =
    method;

  updateProgress();

  ui.accountVerify.style.display =
    "block";

  hide(
    ui.accountStatus
  );

  hide(
    ui.accountError
  );

  ui.accountQr
    .classList
    .add(
      "hidden"
    );

  ui.accountQr.innerHTML =
    "";

  ui.accountCodeForm
    .classList
    .add(
      "hidden"
    );

  ui.accountCode.value =
    "";

  if (
    method ===
    "passkey"
  ) {
    ui.accountMessage.textContent =
      "";

    account.verifiedMethods = [
      ...(account.verifiedMethods || []),
      "passkey",
    ];

    account.currentIndex +=
      1;

    updateProgress();

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          350
        )
    );

    return prepareAccountFactor();
  }

  ui.accountMessage.textContent =
    `${methodLabel(method)}を認証します。`;

  let verificationUserId;
  let username;
  let password;

  if (
    method ===
    "app"
  ) {
    verificationUserId =
      account.stagingUserId;

    username =
      account.loginUsername;

    password =
      account.loginPassword;
  } else {
    accountStatus(
      "メール認証を準備しています…"
    );

    const {
      response,
      data,
    } =
      await workerPost(
        "/create-admin-factor-user",
        {
          stagingUserId:
            account.stagingUserId,

          method:
            "email",
        },
        sessionStorage.getItem(
          "admin_access_token"
        )
      );

    if (
      !response.ok
    ) {
      throw new Error(
        data.error ||
        "メール認証を準備できませんでした。"
      );
    }

    verificationUserId =
      data.verificationUserId;

    username =
      data.loginUsername;

    password =
      data.loginPassword;

    hide(
      ui.accountStatus
    );
  }

  account.currentVerificationUserId =
    verificationUserId;

  const {
    response,
    data,
  } =
    await passwordLogin(
      username,
      password
    );

  if (
    response.ok &&
    data.access_token
  ) {
    throw new Error(
      "MFAが要求されませんでした。Auth0のMFA設定を確認してください。"
    );
  }

  if (
    data.error !==
      "mfa_required" ||
    !data.mfa_token
  ) {
    throw new Error(
      data.error_description ||
      "認証を開始できませんでした。"
    );
  }

  const channel =
    method ===
    "app"
      ? "auth0"
      : "email";

  const assoc =
    await associateMfa(
      data.mfa_token,
      channel,
      method ===
      "email"
        ? account.email
        : ""
    );

  account.currentMfaToken =
    data.mfa_token;

  account.currentOobCode =
    assoc.oob_code;

  if (
    method ===
    "app"
  ) {
    if (
      !assoc.barcode_uri
    ) {
      throw new Error(
        "Guardian登録用QRコードを取得できませんでした。"
      );
    }

    new QRCode(
      ui.accountQr,
      {
        text:
          assoc.barcode_uri,

        width:
          200,

        height:
          200,
      }
    );

    ui.accountQr
      .classList
      .remove(
        "hidden"
      );

    ui.accountMessage.textContent =
      "GuardianアプリでQRコードを読み取り、承認してください。";

    await pollGuardian(
      data.mfa_token,
      assoc.oob_code,
      true
    );
  } else {
    ui.accountMessage.textContent =
      "メールに届いた認証コードを入力してください。";

    ui.accountCodeForm
      .classList
      .remove(
        "hidden"
      );

    ui.accountCode.focus();
  }
}

async function completeAccountFactor(
  accessToken
) {
  const account =
    pendingAccount;

  if (
    !account
  ) {
    return;
  }

  const method =
    account.currentMethod;

  accountStatus(
    `${methodLabel(method)}の認証完了を確認しています…`
  );

  const {
    response,
    data,
  } =
    await workerPost(
      "/create-admin-factor-complete",
      {
        stagingUserId:
          account.stagingUserId,

        verificationUserId:
          account.currentVerificationUserId,

        method,

        verifiedAccessToken:
          accessToken,
      },
      sessionStorage.getItem(
        "admin_access_token"
      )
    );

  if (
    !response.ok
  ) {
    throw new Error(
      data.error ||
      `${methodLabel(method)}の認証完了を確認できませんでした。`
    );
  }

  account.verifiedMethods =
    Array.isArray(
      data.verifiedMethods
    )
      ? data.verifiedMethods
      : [
          ...(
            account.verifiedMethods ||
            []
          ),

          method,
        ];

  account.currentIndex +=
    1;

  account.currentMethod =
    "";

  account.currentVerificationUserId =
    "";

  account.currentMfaToken =
    "";

  account.currentOobCode =
    "";

  accountStop =
    true;

  hide(
    ui.accountStatus
  );

  ui.accountCodeForm
    .classList
    .add(
      "hidden"
    );

  updateProgress();

  if (
    account.currentIndex >=
    account.mfaMethods.length
  ) {
    await finalizeAccount();
  } else {
    accountStatus(
      `${methodLabel(method)}の認証が完了しました。次の認証へ進みます…`
    );

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          450
        )
    );

    await prepareAccountFactor();
  }
}

async function finalizeAccount() {
  const account =
    pendingAccount;

  if (
    !account
  ) {
    return;
  }

  accountStatus(
    "すべての認証が完了しました。アカウントを発行しています…"
  );

  const {
    response,
    data,
  } =
    await workerPost(
      "/create-admin-finalize",
      {
        stagingUserId:
          account.stagingUserId,
      },
      sessionStorage.getItem(
        "admin_access_token"
      )
    );

  if (
    !response.ok
  ) {
    throw new Error(
      data.error ||
      "アカウント発行処理に失敗しました。"
    );
  }

  hide(
    ui.accountVerify
  );

  hide(
    ui.accountStatus
  );

  ui.accountResultTitle.textContent =
    account.simulated
      ? "認証が完了しました。仮発行のため実際のアカウントは作成していません。"
      : "認証がすべて完了し、アカウントを発行しました。";

  ui.resultName.textContent =
    account.fullName;

  ui.resultId.textContent =
    account.username;

  ui.resultPassword.textContent =
    account.initialPassword;

  ui.resultMfa.textContent =
    account.mfaMethods
      .map(
        methodLabel
      )
      .join(
        " / "
      );

  ui.accountResult.style.display =
    "block";

  ui.createForm.reset();

  ui.createPasskey.checked =
    true;

  ui.createEmailCheck.checked =
    false;

  ui.createApp.checked =
    false;

  setCreateDisabled(
    false
  );

  updateCreateRequirements();

  pendingAccount =
    null;
}

ui.createForm.addEventListener(
  "submit",
  async event => {
    event.preventDefault();

    hide(
      ui.accountError
    );

    hide(
      ui.accountStatus
    );

    ui.accountResult.style.display =
      "none";

    resetAccountVerification();

    if (
      (
        sessionStorage.getItem(
          "admin_sub"
        ) ||
        ""
      ) !== OWNER_SUB
    ) {
      return accountError(
        "この操作を行う権限がありません。"
      );
    }

    const methods =
      selectedCreateMethods();

    const email =
      ui.createEmail.value.trim();

    if (
      !methods.length
    ) {
      return accountError(
        "認証方法を1つ以上選択してください。"
      );
    }

    if (
      (
        methods.includes(
          "passkey"
        ) ||
        methods.includes(
          "email"
        )
      ) &&
      !email
    ) {
      return accountError(
        "メールアドレスを入力してください。"
      );
    }

    ui.createButton.disabled =
      true;

    accountStatus(
      "認証用の準備をしています…"
    );

    try {
      const {
        response,
        data,
      } =
        await workerPost(
          "/create-admin",
          {
            fullName:
              ui.createName.value.trim(),

            lastNameRoman:
              ui.createLast.value.trim(),

            firstNameRoman:
              ui.createFirst.value.trim(),

            birthYear:
              Number(
                ui.createYear.value
              ),

            email,

            mfaMethods:
              methods,
          },
          sessionStorage.getItem(
            "admin_access_token"
          )
        );

      if (
        !response.ok
      ) {
        throw new Error(
          data.error ||
          "認証の準備ができませんでした。"
        );
      }

      pendingAccount = {
        ...data,

        currentIndex:
          0,

        currentMethod:
          "",

        currentVerificationUserId:
          "",

        currentMfaToken:
          "",

        currentOobCode:
          "",

        verifiedMethods:
          [],
      };

      setCreateDisabled(
        true
      );

      hide(
        ui.accountStatus
      );

      await prepareAccountFactor();
    } catch (
      error
    ) {
      setCreateDisabled(
        false
      );

      updateCreateRequirements();

      accountError(
        error.message ||
        "アカウント認証を開始できませんでした。"
      );
    } finally {
      if (
        !pendingAccount
      ) {
        ui.createButton.disabled =
          false;
      }
    }
  }
);

ui.accountCodeForm.addEventListener(
  "submit",
  async event => {
    event.preventDefault();

    const account =
      pendingAccount;

    if (
      !account?.currentMfaToken ||
      !account?.currentOobCode
    ) {
      return accountError(
        "認証情報がありません。"
      );
    }

    const code =
      ui.accountCode.value.trim();

    if (
      !/^\d{4,10}$/.test(
        code
      )
    ) {
      return accountError(
        "認証コードを数字で入力してください。"
      );
    }

    ui.accountCodeButton.disabled =
      true;

    try {
      const {
        response,
        data,
      } =
        await verifyMfa(
          account.currentMfaToken,
          account.currentOobCode,
          code
        );

      if (
        !response.ok ||
        !data.access_token
      ) {
        throw new Error(
          data.error_description ||
          data.error ||
          "認証コードが正しくありません。"
        );
      }

      await completeAccountFactor(
        data.access_token
      );
    } catch (
      error
    ) {
      accountError(
        error.message ||
        "認証できませんでした。"
      );
    } finally {
      ui.accountCodeButton.disabled =
        false;
    }
  }
);

ui.copyId.addEventListener(
  "click",
  () =>
    navigator.clipboard.writeText(
      ui.resultId.textContent
    )
);

ui.copyPassword.addEventListener(
  "click",
  () =>
    navigator.clipboard.writeText(
      ui.resultPassword.textContent
    )
);

ui.refresh.addEventListener(
  "click",
  () => {
    if (
      pendingAccount
    ) {
      return alert(
        "アカウント認証中は更新できません。"
      );
    }

    location.reload();
  }
);

ui.logout.addEventListener(
  "click",
  async () => {
    guardianStop =
      true;

    accountStop =
      true;

    const authMode =
      sessionStorage.getItem(
        "admin_auth_mode"
      );

    clearSession();

    resetAccountVerification();

    if (
      authMode ===
        "passkey" &&
      auth0Client
    ) {
      try {
        await auth0Client.logout({
          logoutParams: {
            returnTo:
              AUTH0_REDIRECT_URI,
          },
        });

        return;
      } catch (
        error
      ) {
        console.error(
          error
        );
      }
    }

    showLogin();
  }
);

initAuth();
</script>
