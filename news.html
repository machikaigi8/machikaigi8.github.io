<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ニュース｜みんなのまち会議</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#FFFDF7;color:#111;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;overflow-x:hidden}

/* =========================
   共通：黄色帯アニメーション
   ========================= */
@keyframes yellowSlideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes headerContentFadeIn{from{opacity:0}to{opacity:1}}
.top-space,.header,.subtitle-line{animation:yellowSlideIn .85s cubic-bezier(.22,1,.36,1) both}
.title,.nav-menu,.subtitle{opacity:0;animation:headerContentFadeIn .5s ease-out .85s forwards}

/* =========================
   共通：黄色帯
   ========================= */
.top-space{height:8px;background-color:rgba(255,220,100,.80);position:relative;z-index:10}
.header{position:sticky;top:0;width:100%;box-sizing:border-box;padding:18px 34px 12px;display:flex;align-items:flex-end;justify-content:space-between;background-color:rgba(255,220,100,.80);z-index:100}
.title{margin:0;font-size:54px;line-height:1;font-family:"HGP創英ﾌﾟﾚｾﾞﾝｽEB",sans-serif;color:#001E00;white-space:nowrap}
.title a{display:inline-block;color:inherit;text-decoration:none}
.nav-menu{display:flex;gap:30px;align-items:center}
.nav-menu a{color:#000;text-decoration:none;font-size:24px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;white-space:nowrap;transition:opacity .2s}
.nav-menu a:hover{opacity:.55}
.subtitle-line{width:100%;box-sizing:border-box;padding:0 34px 8px;background-color:rgba(255,220,100,.80);position:relative;z-index:10;clip-path:inset(0 0 0 0)}
.subtitle{margin:0;font-size:15px;line-height:1.5;color:#003700;font-family:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif}

/* =========================
   ニュース本文
   ========================= */
.main{width:min(1180px,calc(100% - 32px));margin:46px auto 80px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px;border-bottom:4px solid #145E20;padding-bottom:14px}
.page-head h1{margin:0;font-size:38px;color:#145E20}
.back{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 22px;border:2px solid #145E20;border-radius:999px;background:#FFFDF7;color:#145E20;font-size:17px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s,color .18s,transform .18s}
.back:hover{background:#145E20;color:#fff;transform:translateY(-1px)}
.news-list{display:block}
.news-card{display:grid;grid-template-columns:140px minmax(0,1fr) 34px;align-items:center;gap:18px;min-height:108px;padding:10px 4px;border:0;border-bottom:1px solid #d8ddd8;background:transparent;text-decoration:none;color:#111}
.news-card:hover{background:rgba(20,94,32,.035)}
.news-card-media{width:140px;height:82px;object-fit:cover;background:#EEF1F5}
.news-card-pdf{width:140px;height:82px;display:flex;align-items:center;justify-content:center;background:#f1f3f1;color:#145E20;font-size:22px;font-weight:700;letter-spacing:.04em}
.news-card-body{min-width:0;padding:0}
.news-date{margin:0 0 5px;color:#6d776f;font-size:13px;text-align:right}
.news-card-title{margin:0 0 7px;color:#2f548f;font-size:21px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news-excerpt{margin:0;color:#53625a;font-size:14px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news-arrow{font-family:Arial,sans-serif;color:#2f548f;font-size:24px;line-height:1;text-align:center}
.empty{padding:30px;border:0;border-top:1px solid #D3D8D3;border-bottom:1px solid #D3D8D3;text-align:center;color:#627066}
.article{background:#fff;border:2px solid #145E20;border-radius:24px;padding:34px}
.article-date{margin:0 0 10px;color:#627066}
.article-title{margin:0 0 28px;font-size:36px;line-height:1.45}
.article-body{margin:0 0 32px;font-size:18px;line-height:2;white-space:pre-wrap}
.article-wrap{display:flow-root;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;font-size:18px;line-height:2;color:#111}
.article-wrap-body{white-space:pre-wrap;overflow-wrap:anywhere}
.article-wrap-image{display:block;height:auto;object-fit:contain}
.article-wrap-image.left{float:left;margin-right:22px;margin-left:0}
.article-wrap-image.right{float:right;margin-left:22px;margin-right:0}
.article-layout-viewport{position:relative;width:100%;overflow:hidden}
.article-layout-stage{position:absolute;left:0;top:0;width:1000px;background:#FFFDF7;overflow:hidden;transform-origin:top left}
.article-layout-text{position:absolute;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;font-size:18px;line-height:1.8;color:#111}
.article-layout-image{position:absolute;display:block;object-fit:contain}
.article-media{overflow:hidden;background:#EEF1F5}
.article-media img{width:100%;height:100%;display:block;object-fit:cover}
.pdf-frame{width:100%;height:75vh;min-height:520px;border:1px solid #AAB5C4}
.pdf-open{display:inline-block;margin-top:14px;padding:10px 16px;border:2px solid #145E20;color:#145E20;font-weight:700;text-decoration:none}
.status{text-align:center;padding:30px;color:#627066}

@media(max-width:768px){
  .top-space{height:8px}
  .header{padding:16px 24px 12px;display:block}
  .title{font-size:32px}
  .nav-menu{margin-top:14px;gap:14px;flex-wrap:wrap}
  .nav-menu a{font-size:12px}
  .subtitle-line{padding:0 24px 8px}
  .subtitle{font-size:13px}
  .main{margin-top:28px}
  .page-head{align-items:flex-start}
  .page-head h1{font-size:30px}
  .back{min-height:44px;padding:9px 16px;font-size:14px}
  .news-card{grid-template-columns:104px minmax(0,1fr) 18px;gap:12px;min-height:96px;padding:12px 0}
  .news-card-media,.news-card-pdf{width:104px;height:70px}
  .news-card-pdf{font-size:17px}
  .news-card-title{font-size:17px}
  .news-date{font-size:12px}
  .news-excerpt{font-size:13px}
  .news-arrow{font-size:20px}
  .article{padding:22px 16px}
  .article-title{font-size:29px}
  .pdf-frame{min-height:420px}
}

@media(prefers-reduced-motion:reduce){
  .top-space,.header,.subtitle-line,.title,.nav-menu,.subtitle{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="top-space"></div>
<header class="header">
  <h1 class="title"><a href="index.html" aria-label="みんなのまち会議 トップページへ">みんなのまち会議</a></h1>
  <nav class="nav-menu">
    <a href="news.html">ニュース</a>
    <a href="about.html">まち会議とは</a>
    <a href="organization.html">団体概要</a>
    <a href="contact.html">お問い合わせ</a>
  </nav>
</header>
<div class="subtitle-line">
  <p class="subtitle">若者と、はちおうじの街を考える会議</p>
</div>
<main class="main">
  <div class="page-head">
    <h1 id="page-heading">ニュース</h1>
    <a id="back-link" class="back" href="index.html">← トップへ戻る</a>
  </div>
  <div id="news-root" class="status">ニュースを読み込んでいます…</div>
</main>
<script>
const WORKER_URL = "https://machikaigi-admin-api.taka-souda516.workers.dev";
const NEWS_API_URL = `${WORKER_URL}/news-public`;
const NEWS_FILE_BASE_URL = `${WORKER_URL}/news-file/`;
const root = document.getElementById("news-root");
const heading = document.getElementById("page-heading");
const backLink = document.getElementById("back-link");

function formatNewsDate(value) {
  if (!value) return "";
  const date = new Date(value.endsWith("Z") || /[+-]\d\d:\d\d$/.test(value) ? value : `${value.replace(" ", "T")}Z`);
  if (Number.isNaN(date.getTime())) return value;
  return new Intl.DateTimeFormat("ja-JP", {year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Asia/Tokyo"}).format(date);
}

function newsFileUrl(id) {
  return `${NEWS_FILE_BASE_URL}${encodeURIComponent(id)}`;
}

function makeListCard(item) {
  const link = document.createElement("a");
  link.className = "news-card";
  link.href = `news.html?id=${encodeURIComponent(item.id)}`;

  if (item.fileType === "image") {
    const image = document.createElement("img");
    image.className = "news-card-media";
    image.src = newsFileUrl(item.id);
    image.alt = "";
    image.loading = "lazy";
    link.append(image);
  } else {
    const pdf = document.createElement("div");
    pdf.className = "news-card-pdf";
    pdf.textContent = "PDF";
    link.append(pdf);
  }

  const body = document.createElement("div");
  body.className = "news-card-body";
  const date = document.createElement("p");
  date.className = "news-date";
  date.textContent = `掲載：${formatNewsDate(item.createdAt)}`;
  const title = document.createElement("h2");
  title.className = "news-card-title";
  title.textContent = item.title || "（タイトルなし）";
  const excerpt = document.createElement("p");
  excerpt.className = "news-excerpt";
  excerpt.textContent = (item.body || "").replace(/\s+/g, " ").trim();
  body.append(date,title,excerpt);

  const arrow = document.createElement("div");
  arrow.className = "news-arrow";
  arrow.setAttribute("aria-hidden", "true");
  arrow.textContent = "→";

  link.append(body, arrow);
  return link;
}

function renderWrappedImageArticle(item, article) {
  const layout = item.layout || {};
  const imageLayout = layout.image || {};
  const wrapper = document.createElement("div");
  wrapper.className = "article-wrap";

  const image = document.createElement("img");
  const side = imageLayout.side === "right" ? "right" : "left";
  const width = Math.min(90, Math.max(18, Number(imageLayout.width || 42)));
  const top = Math.min(1800, Math.max(0, Number(imageLayout.top || 0)));
  image.className = `article-wrap-image ${side}`;
  image.src = newsFileUrl(item.id);
  image.alt = item.title || "ニュース写真";
  image.loading = "eager";
  image.style.width = `${width}%`;
  image.style.marginTop = `${top}px`;

  const body = document.createElement("div");
  body.className = "article-wrap-body";
  body.textContent = item.body || "";

  wrapper.append(image, body);
  article.append(wrapper);
}

function applyManualBox(element, box) {
  element.style.left = `${box.x}%`;
  element.style.top = `${box.y}%`;
  element.style.width = `${box.width}%`;
  element.style.height = `${box.height}%`;
}

function renderManualImageArticle(item, article) {
  const layout = item.layout;
  const canvasHeight = Math.min(1600, Math.max(500, Number(layout.canvasHeight || 800)));
  const viewport = document.createElement("div");
  viewport.className = "article-layout-viewport";

  const stage = document.createElement("div");
  stage.className = "article-layout-stage";
  stage.style.height = `${canvasHeight}px`;

  const text = document.createElement("div");
  text.className = "article-layout-text";
  text.textContent = item.body || "";
  applyManualBox(text, layout.text);

  const image = document.createElement("img");
  image.className = "article-layout-image";
  image.src = newsFileUrl(item.id);
  image.alt = item.title || "ニュース写真";
  image.loading = "eager";
  applyManualBox(image, layout.image);

  const fit = () => {
    const available = Math.max(280, viewport.clientWidth);
    const scale = Math.min(1, available / 1000);
    const left = Math.max(0, (available - 1000) / 2);
    stage.style.left = `${left}px`;
    stage.style.transform = `scale(${scale})`;
    viewport.style.height = `${Math.ceil(canvasHeight * scale)}px`;
  };

  stage.append(text, image);
  viewport.append(stage);
  article.append(viewport);
  requestAnimationFrame(fit);

  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(fit);
    observer.observe(viewport);
  } else {
    window.addEventListener("resize", fit);
  }
}

function renderLegacyImage(item, article) {
  const layout = item.layout || {};
  const body = document.createElement("p");
  body.className = "article-body";
  body.textContent = item.body || "";
  article.append(body);

  const media = document.createElement("div");
  media.className = "article-media";
  const width = layout.mode === "full" ? 100 : Math.min(100, Math.max(40, Number(layout.width || 70)));
  media.style.width = `${width}%`;
  media.style.height = `${Math.min(700, Math.max(180, Number(layout.height || 360)))}px`;
  if (layout.mode === "right") {
    media.style.marginLeft = "auto";
    media.style.marginRight = "0";
  } else if (layout.mode === "center") {
    media.style.marginLeft = "auto";
    media.style.marginRight = "auto";
  } else {
    media.style.marginLeft = "0";
    media.style.marginRight = "auto";
  }
  const image = document.createElement("img");
  image.src = newsFileUrl(item.id);
  image.alt = item.title || "ニュース写真";
  image.style.objectPosition = `${layout.x ?? 50}% ${layout.y ?? 50}%`;
  media.append(image);
  article.append(media);
}

function renderPdf(item, article) {
  const body = document.createElement("p");
  body.className = "article-body";
  body.textContent = item.body || "";
  article.append(body);

  const frame = document.createElement("iframe");
  frame.className = "pdf-frame";
  frame.src = newsFileUrl(item.id);
  frame.title = item.fileName || "ニュースPDF";
  article.append(frame);
  const open = document.createElement("a");
  open.className = "pdf-open";
  open.href = newsFileUrl(item.id);
  open.target = "_blank";
  open.rel = "noopener noreferrer";
  open.textContent = "PDFを別画面で開く";
  article.append(open);
}

async function loadList() {
  const response = await fetch(`${NEWS_API_URL}?limit=100`, {method:"GET",mode:"cors",credentials:"omit"});
  const data = await response.json();
  if (!response.ok || !data.ok) throw new Error(data.error || "ニュースを取得できませんでした。");
  root.className = "news-list";
  root.innerHTML = "";
  if (!data.news?.length) {
    root.className = "empty";
    root.textContent = "現在掲載中のニュースはありません。";
    return;
  }
  data.news.forEach(item => root.append(makeListCard(item)));
}

async function loadDetail(id) {
  const response = await fetch(`${NEWS_API_URL}?id=${encodeURIComponent(id)}`, {method:"GET",mode:"cors",credentials:"omit"});
  const data = await response.json();
  if (!response.ok || !data.ok || !data.news) throw new Error(data.error || "ニュースを取得できませんでした。");
  const item = data.news;
  document.title = `${item.title}｜みんなのまち会議`;
  heading.textContent = "ニュース";
  backLink.href = "news.html";
  backLink.textContent = "← ニュース一覧へ戻る";
  root.className = "";
  root.innerHTML = "";
  const article = document.createElement("article");
  article.className = "article";
  const date = document.createElement("p");
  date.className = "article-date";
  date.textContent = formatNewsDate(item.createdAt);
  const title = document.createElement("h1");
  title.className = "article-title";
  title.textContent = item.title || "（タイトルなし）";
  article.append(date,title);

  if (item.fileType === "image" && item.layout?.type === "wrap") {
    renderWrappedImageArticle(item, article);
  } else if (item.fileType === "image" && item.layout?.type === "manual") {
    renderManualImageArticle(item, article);
  } else if (item.fileType === "image") {
    renderLegacyImage(item, article);
  } else {
    renderPdf(item, article);
  }

  root.append(article);
}

(async()=>{
  try {
    const id = new URLSearchParams(location.search).get("id");
    if (id) await loadDetail(id);
    else await loadList();
  } catch (error) {
    console.error(error);
    root.className = "empty";
    root.textContent = error.message || "ニュースを読み込めませんでした。";
  }
})();
</script>
</body>
</html>
