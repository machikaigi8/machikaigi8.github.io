<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- 制作中なので検索結果に表示させない -->
    <meta name="robots" content="noindex, nofollow">

    <title>みんなのまち会議</title>

    <style>

        body {
            margin: 0;
        }


        /* =========================
           最上部の空白
           ========================= */

        .top-space {
            height: 8px;

            background-color:
                rgba(255, 220, 100, 0.80);

            position: relative;
            z-index: 10;
        }


        /* =========================
           上端で固定されるヘッダー
           ========================= */

        .header {
            position: sticky;
            top: 0;

            width: 100%;

            box-sizing: border-box;

            /*
               「みんなのまち会議」の下に12px
            */
            padding: 18px 34px 12px 34px;

            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            background-color:
                rgba(255, 220, 100, 0.80);

            z-index: 100;
        }


        /* みんなのまち会議 */
        .title {
            margin: 0;

            font-size: 54px;
            line-height: 1;

            font-family:
                "HGP創英ﾌﾟﾚｾﾞﾝｽEB",
                sans-serif;

            color: #001E00;

            white-space: nowrap;
        }


        /* =========================
           ナビゲーション
           ========================= */

        .nav-menu {
            display: flex;

            gap: 30px;

            align-items: center;
        }


        .nav-menu a {
            color: #000000;

            text-decoration: none;

            font-size: 24px;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            white-space: nowrap;

            transition: opacity 0.2s;
        }


        .nav-menu a:hover {
            opacity: 0.55;
        }


        /* =========================
           サブタイトル部分
           ========================= */

        .subtitle-line {
            width: 100%;

            box-sizing: border-box;

            /* 上側の余白は0px */
            padding: 0 34px 8px 34px;

            background-color:
                rgba(255, 220, 100, 0.80);

            position: relative;

            z-index: 10;
        }


        .subtitle {
            margin: 0;

            font-size: 15px;
            line-height: 1.5;

            color: #003700;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;
        }


        /* =========================
           メイン
           ========================= */

        .main {
            display: grid;

            grid-template-columns: 45% 55%;

            min-height: 635px;
        }


        /* =========================
           リリース文
           ========================= */

        .message {
            grid-column: 1;

            margin: 0;

            padding: 45px 38px 25px 38px;

            font-size: 18px;
        }


        /* =========================
           写真
           ========================= */

        .photo {
            /*
               写真そのものはHP最上部から開始
            */
            position: absolute;

            top: 0;
            right: 0;

            width: 55%;

            z-index: 0;
        }


        .photo img {
            width: 100%;
            height: 635px;

            object-fit: cover;

            display: block;
        }


        /* =========================
           スマホ用
           ========================= */

        @media (max-width: 768px) {

            .top-space {
                height: 8px;
            }


            .header {
                padding: 16px 24px 12px 24px;

                display: block;
            }


            .title {
                font-size: 32px;
            }


            .nav-menu {
                margin-top: 14px;

                gap: 14px;

                flex-wrap: wrap;
            }


            .nav-menu a {
                font-size: 12px;
            }


            .subtitle-line {
                padding: 0 24px 8px 24px;
            }


            .subtitle {
                font-size: 13px;
            }


            .main {
                display: block;

                min-height: auto;
            }


            /*
               スマホでは写真を通常配置に戻す
            */
            .photo {
                position: static;

                width: 100%;
            }


            .photo img {
                width: 100%;
                height: 350px;

                object-fit: cover;
            }


            .message {
                margin: 0;

                padding: 28px 24px;

                font-size: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- 最初だけ見える8px -->
    <div class="top-space"></div>


    <!-- スクロールすると上端で固定 -->
    <header class="header">

        <h1 class="title">
            みんなのまち会議
        </h1>


        <nav class="nav-menu">

            <a href="news.html">
                ニュース
            </a>

            <a href="about.html">
                まち会議とは
            </a>

            <a href="organization.html">
                団体概要
            </a>

        </nav>

    </header>


    <!-- 普通にスクロールして消える -->
    <div class="subtitle-line">

        <p class="subtitle">
            若者と、はちおうじの街を考える会議
        </p>

    </div>


    <main class="main">


        <p class="message">
            リリースまで少々お待ちください。
        </p>


        <div class="photo">

            <img
                src="main-photo.jpg"
                alt="みんなのまち会議の様子"
            >

        </div>


    </main>


</body>

</html>
