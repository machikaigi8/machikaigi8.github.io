<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 制作中なので検索結果に表示させない -->
    <meta name="robots" content="noindex, nofollow">

    <title>みんなのまち会議</title>

    <style>

        body {
            margin: 0;
        }

        .main {
            position: relative;

            display: grid;

            grid-template-columns: 45% 55%;
            grid-template-rows: 150px auto;

            grid-template-areas:
                "heading photo"
                "message photo";

            min-height: 635px;
        }


        /* 黄色の帯 */
        .yellow-line {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 150px;

            background-color: rgba(255, 220, 100, 0.80);

            z-index: 2;
        }


        /* タイトル全体 */
        .heading {
            grid-area: heading;

            position: relative;
            z-index: 3;

            padding: 24px 34px;
        }


        /* メインタイトル */
        .title {
            margin: 0;

            font-size: 54px;
            font-family: "HGP創英ﾌﾟﾚｾﾞﾝｽEB", sans-serif;
            color: #001E00;
        }


        /* サブタイトル */
        .subtitle {
            margin: 10px 0 0 0;

            font-size: 15px;
            color: #003700;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;
        }


        /* 説明文 */
        .message {
            grid-area: message;

            padding: 25px 38px;

            font-size: 18px;
        }


        /* 写真 */
        .photo {
            grid-area: photo;
        }

        .photo img {
            width: 100%;
            height: 635px;

            object-fit: cover;

            display: block;
        }


        /* =========================
           スマホ用
           ========================= */

        @media (max-width: 768px) {

            .main {
                display: grid;

                grid-template-columns: 100%;
                grid-template-rows: 120px auto auto;

                grid-template-areas:
                    "heading"
                    "photo"
                    "message";

                min-height: auto;
            }


            .yellow-line {
                height: 120px;
            }


            .heading {
                padding: 24px;
            }


            .title {
                font-size: 30px;

                white-space: nowrap;
            }


            .subtitle {
                margin-top: 10px;

                font-size: 13px;
            }


            .photo img {
                width: 100%;
                height: 350px;

                object-fit: cover;
            }


            .message {
                padding: 28px 24px;

                font-size: 16px;
            }

        }

    </style>

</head>


<body>

    <main class="main">

        <div class="yellow-line"></div>


        <div class="heading">

            <h1 class="title">
                みんなのまち会議
            </h1>

            <p class="subtitle">
                若者と、はちおうじの街を考える会議
            </p>

        </div>


        <div class="photo">

            <img
                src="main-photo.jpg"
                alt="みんなのまち会議の様子"
            >

        </div>


        <p class="message">
            リリースまで少々お待ちください。
        </p>

    </main>

</body>

</html>
