<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- 制作中なので検索結果に表示させない -->
    <meta name="robots" content="noindex, nofollow">

    <title>みんなのまち会議</title>

    <style>

        body {
            margin: 0;
        }


        /* =========================
           最上部のスペース
           スクロールすると普通に消える
           ========================= */

        .top-space {
            height: 35px;

            background-color:
                rgba(255, 220, 100, 0.80);
        }


        /* =========================
           固定ヘッダー
           ========================= */

        .header {
            position: sticky;
            top: 0;

            width: 100%;
            height: 78px;

            box-sizing: border-box;

            padding: 18px 34px 0 34px;

            display: flex;

            align-items: flex-end;
            justify-content: space-between;

            /*
               最初は透明。
               後ろにある黄色帯を見せる。
            */
            background-color: transparent;

            z-index: 100;
        }


        /*
           ヘッダーが上端に到達した後だけ
           黄色を付ける。

           半透明の帯同士が重なって
           濃く見えないように
           固定時は同等色の不透明色にする。
        */

        .header.stuck {
            background-color: #FFE383;
        }


        /* みんなのまち会議 */
        .title {
            margin: 0;

            font-size: 54px;
            line-height: 1;

            font-family:
                "HGP創英ﾌﾟﾚｾﾞﾝｽEB",
                sans-serif;

            color: #001E00;

            white-space: nowrap;
        }


        /* =========================
           ナビゲーション
           ========================= */

        .nav-menu {
            display: flex;

            gap: 30px;

            align-items: center;

            padding-bottom: 6px;
        }


        .nav-menu a {
            color: #000000;

            text-decoration: none;

            font-size: 24px;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            white-space: nowrap;

            transition: opacity 0.2s;
        }


        .nav-menu a:hover {
            opacity: 0.55;
        }


        /* =========================
           メイン
           ========================= */

        .main {
            position: relative;

            display: grid;

            grid-template-columns: 45% 55%;

            min-height: 635px;


            /*
               写真・黄色帯を
               ヘッダーの後ろまで伸ばす
            */
            margin-top: -78px;
        }


        /* =========================
           最初に見える黄色帯
           ========================= */

        .yellow-line {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 128px;

            background-color:
                rgba(255, 220, 100, 0.80);

            z-index: 2;

            pointer-events: none;
        }


        /* =========================
           サブタイトル
           ========================= */

        .subtitle {
            position: absolute;

            /*
               タイトル行の下から
               約15px空ける
            */
            top: 93px;
            left: 34px;

            margin: 0;

            z-index: 3;

            font-size: 15px;

            color: #003700;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;
        }


        /* =========================
           リリース文
           ========================= */

        .message {
            grid-column: 1;

            margin: 0;

            padding: 195px 38px 25px 38px;

            font-size: 18px;
        }


        /* =========================
           写真
           ========================= */

        .photo {
            grid-column: 2;
        }


        .photo img {
            width: 100%;
            height: 635px;

            object-fit: cover;

            display: block;
        }



        /* =========================
           スマホ用
           ========================= */

        @media (max-width: 768px) {

            .top-space {
                height: 35px;
            }


            .header {
                height: 110px;

                padding: 16px 24px;

                display: block;
            }


            .title {
                font-size: 32px;
            }


            .nav-menu {
                margin-top: 14px;

                gap: 14px;

                padding-bottom: 0;

                flex-wrap: wrap;
            }


            .nav-menu a {
                font-size: 12px;
            }


            .main {
                display: block;

                margin-top: -110px;

                min-height: auto;

                padding-top: 155px;
            }


            .yellow-line {
                height: 155px;
            }


            .subtitle {
                top: 125px;
                left: 24px;

                font-size: 13px;
            }


            .photo img {
                width: 100%;
                height: 350px;

                object-fit: cover;
            }


            .message {
                margin: 0;

                padding: 28px 24px;

                font-size: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- 最初だけ見える35px -->
    <div class="top-space"></div>


    <!-- 上端に到達すると固定 -->
    <header class="header">


        <h1 class="title">
            みんなのまち会議
        </h1>


        <nav class="nav-menu">

            <a href="news.html">
                ニュース
            </a>

            <a href="about.html">
                まち会議とは
            </a>

            <a href="organization.html">
                団体概要
            </a>

        </nav>


    </header>



    <main class="main">


        <!-- 黄色の帯 -->
        <div class="yellow-line"></div>


        <!-- 普通にスクロールして上へ消える -->
        <p class="subtitle">
            若者と、はちおうじの街を考える会議
        </p>


        <!-- 写真 -->
        <div class="photo">

            <img
                src="main-photo.jpg"
                alt="みんなのまち会議の様子"
            >

        </div>


        <!-- リリース文 -->
        <p class="message">
            リリースまで少々お待ちください。
        </p>


    </main>


    <script>

        const header =
            document.querySelector(".header");

        const topSpace =
            document.querySelector(".top-space");


        function updateHeader() {

            /*
               最上部35pxが消えたら
               ヘッダーが固定状態になる
            */

            if (
                window.scrollY >=
                topSpace.offsetHeight
            ) {

                header.classList.add("stuck");

            } else {

                header.classList.remove("stuck");

            }

        }


        window.addEventListener(
            "scroll",
            updateHeader
        );


        updateHeader();

    </script>


</body>

</html>
