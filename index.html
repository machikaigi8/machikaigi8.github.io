<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- 制作中なので検索結果に表示させない -->
    <meta name="robots" content="noindex, nofollow">

    <title>みんなのまち会議</title>

    <style>

        body {
            margin: 0;
        }


        /* ページ全体 */
        .main {
            position: relative;

            display: grid;
            grid-template-columns: 45% 55%;

            min-height: 635px;
        }


        /* 黄色の帯 */
        .yellow-line {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 150px;

            background-color: rgba(255, 220, 100, 0.80);

            z-index: 2;
        }


        /* =========================
           ヘッダー
           ========================= */

        .header {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 150px;

            box-sizing: border-box;

            padding: 20px 34px;

            z-index: 3;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        /* タイトル側 */
        .brand {
            flex-shrink: 0;
        }


        /* みんなのまち会議 */
        .title {
            margin: 0;

            font-size: 54px;
            line-height: 1;

            font-family:
                "HGP創英ﾌﾟﾚｾﾞﾝｽEB",
                sans-serif;

            color: #001E00;
        }


        /* 若者と、はちおうじの街を考える会議 */
        .subtitle {
            margin: 10px 0 0 0;

            font-size: 15px;

            color: #003700;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;
        }


        /* =========================
           ナビゲーション
           ========================= */

        .nav-menu {
            display: flex;

            gap: 30px;

            align-items: center;
        }


        .nav-menu a {
            color: #003700;

            text-decoration: none;

            font-size: 16px;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            white-space: nowrap;

            transition: opacity 0.2s;
        }


        /* マウスを乗せた時 */
        .nav-menu a:hover {
            opacity: 0.55;
        }


        /* =========================
           リリース文
           ========================= */

        .message {
            grid-column: 1;

            margin: 0;

            padding: 195px 38px 25px 38px;

            font-size: 18px;
        }


        /* =========================
           写真
           ========================= */

        .photo {
            grid-column: 2;
        }


        .photo img {
            width: 100%;
            height: 635px;

            object-fit: cover;

            display: block;
        }



        /* =========================
           スマホ用
           ========================= */

        @media (max-width: 768px) {

            .main {
                display: block;

                min-height: auto;
            }


            /* 黄色帯 */
            .yellow-line {
                height: 170px;
            }


            /* ヘッダー */
            .header {
                position: relative;

                height: 170px;

                padding: 20px 24px;

                display: block;
            }


            /* タイトル */
            .title {
                font-size: 32px;

                white-space: nowrap;
            }


            /* サブタイトル */
            .subtitle {
                margin-top: 10px;

                font-size: 13px;
            }


            /* スマホのメニュー */
            .nav-menu {
                margin-top: 18px;

                display: flex;

                gap: 14px;

                flex-wrap: wrap;
            }


            .nav-menu a {
                font-size: 12px;
            }


            /* 写真 */
            .photo img {
                width: 100%;
                height: 350px;

                object-fit: cover;
            }


            /* リリース文 */
            .message {
                margin: 0;

                padding: 28px 24px;

                font-size: 16px;
            }

        }

    </style>

</head>


<body>

    <main class="main">


        <!-- 黄色の帯 -->
        <div class="yellow-line"></div>


        <!-- ヘッダー -->
        <header class="header">


            <!-- タイトル -->
            <div class="brand">

                <h1 class="title">
                    みんなのまち会議
                </h1>

                <p class="subtitle">
                    若者と、はちおうじの街を考える会議
                </p>

            </div>


            <!-- メニュー -->
            <nav class="nav-menu">

                <a href="news.html">
                    ∨ ニュース
                </a>

                <a href="about.html">
                    ∨ まち会議とは
                </a>

                <a href="organization.html">
                    ∨ 団体概要
                </a>

            </nav>


        </header>


        <!-- 写真 -->
        <div class="photo">

            <img
                src="main-photo.jpg"
                alt="みんなのまち会議の様子"
            >

        </div>


        <!-- リリース文 -->
        <p class="message">
            リリースまで少々お待ちください。
        </p>


    </main>

</body>

</html>
