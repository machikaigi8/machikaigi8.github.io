<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- 制作中なので検索結果に表示させない -->
    <meta name="robots" content="noindex, nofollow">

    <title>みんなのまち会議</title>

    <style>

        body {
            margin: 0;
        }


        /* =========================
           最初だけ見える上の空白
           ========================= */

        .top-space {
            height: 30px;

            background-color: #ffffff;
        }


        /* =========================
           スクロールすると上端で止まる部分
           ========================= */

        .header {
            position: sticky;

            top: 0;

            width: 100%;
            height: 90px;

            box-sizing: border-box;

            padding: 18px 34px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background-color: rgba(255, 220, 100, 0.80);

            z-index: 100;
        }


        /* みんなのまち会議 */
        .title {
            margin: 0;

            font-size: 54px;
            line-height: 1;

            font-family:
                "HGP創英ﾌﾟﾚｾﾞﾝｽEB",
                sans-serif;

            color: #001E00;

            white-space: nowrap;
        }


        /* =========================
           ナビゲーション
           ========================= */

        .nav-menu {
            display: flex;

            gap: 30px;

            align-items: center;
        }


        .nav-menu a {
            color: #000000;

            text-decoration: none;

            font-size: 24px;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            white-space: nowrap;

            transition: opacity 0.2s;
        }


        .nav-menu a:hover {
            opacity: 0.55;
        }


        /* =========================
           メイン
           ========================= */

        .main {
            position: relative;

            display: grid;

            grid-template-columns: 45% 55%;

            min-height: 635px;

            /*
               写真をヘッダーの裏まで伸ばす
            */
            margin-top: -90px;
        }


        /* =========================
           サブタイトル部分の黄色帯
           ========================= */

        .subtitle-line {
            position: absolute;

            top: 90px;
            left: 0;

            width: 100%;
            height: 38px;

            background-color: rgba(255, 220, 100, 0.80);

            z-index: 2;

            pointer-events: none;
        }


        /* サブタイトル */
        .subtitle {
            position: absolute;

            top: 99px;
            left: 34px;

            margin: 0;

            z-index: 3;

            font-size: 15px;

            color: #003700;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;
        }


        /* =========================
           リリース文
           ========================= */

        .message {
            grid-column: 1;

            margin: 0;

            padding: 195px 38px 25px 38px;

            font-size: 18px;
        }


        /* =========================
           写真
           ========================= */

        .photo {
            grid-column: 2;
        }


        .photo img {
            width: 100%;
            height: 635px;

            object-fit: cover;

            display: block;
        }



        /* =========================
           スマホ用
           ========================= */

        @media (max-width: 768px) {


            .top-space {
                height: 20px;
            }


            .header {
                height: 110px;

                padding: 16px 24px;

                display: block;
            }


            .title {
                font-size: 32px;
            }


            .nav-menu {
                margin-top: 14px;

                gap: 14px;

                flex-wrap: wrap;
            }


            .nav-menu a {
                font-size: 12px;
            }


            .main {
                display: block;

                margin-top: -110px;

                min-height: auto;

                padding-top: 155px;
            }


            .subtitle-line {
                top: 110px;

                height: 45px;
            }


            .subtitle {
                top: 121px;
                left: 24px;

                font-size: 13px;
            }


            .photo img {
                width: 100%;
                height: 350px;

                object-fit: cover;
            }


            .message {
                margin: 0;

                padding: 28px 24px;

                font-size: 16px;
            }

        }

    </style>

</head>


<body>


    <!-- 最初だけ見える上の空白 -->
    <div class="top-space"></div>


    <!-- スクロール後も上に残る -->
    <header class="header">


        <h1 class="title">
            みんなのまち会議
        </h1>


        <nav class="nav-menu">

            <a href="news.html">
                ニュース
            </a>

            <a href="about.html">
                まち会議とは
            </a>

            <a href="organization.html">
                団体概要
            </a>

        </nav>


    </header>



    <main class="main">


        <!-- サブタイトル部分だけの黄色帯 -->
        <div class="subtitle-line"></div>


        <!-- スクロールすると消える -->
        <p class="subtitle">
            若者と、はちおうじの街を考える会議
        </p>


        <!-- 写真 -->
        <div class="photo">

            <img
                src="main-photo.jpg"
                alt="みんなのまち会議の様子"
            >

        </div>


        <!-- リリース文 -->
        <p class="message">
            リリースまで少々お待ちください。
        </p>


    </main>

</body>

</html>
