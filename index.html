<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- 制作中なので検索結果に表示させない -->
    <meta name="robots" content="noindex, nofollow">

    <title>みんなのまち会議</title>

    <style>

        body {
            margin: 0;
        }


        /* =========================
           最上部 8px
           ========================= */

        .top-space {
            height: 8px;

            background-color:
                rgba(255, 220, 100, 0.80);

            position: relative;
            z-index: 10;
        }


        /* =========================
           固定ヘッダー
           ========================= */

        .header {
            position: sticky;
            top: 0;

            width: 100%;

            box-sizing: border-box;

            padding: 18px 34px 12px 34px;

            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            background-color:
                rgba(255, 220, 100, 0.80);

            z-index: 100;
        }


        /* みんなのまち会議 */
        .title {
            margin: 0;

            font-size: 54px;
            line-height: 1;

            font-family:
                "HGP創英ﾌﾟﾚｾﾞﾝｽEB",
                sans-serif;

            color: #001E00;

            white-space: nowrap;
        }


        /* =========================
           ナビゲーション
           ========================= */

        .nav-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }


        .nav-menu a {
            color: #000000;

            text-decoration: none;

            font-size: 24px;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            white-space: nowrap;

            transition: opacity 0.2s;
        }


        .nav-menu a:hover {
            opacity: 0.55;
        }


        /* =========================
           サブタイトル帯
           ========================= */

        .subtitle-line {
            width: 100%;

            box-sizing: border-box;

            padding: 0 34px 8px 34px;

            background-color:
                rgba(255, 220, 100, 0.80);

            position: relative;
            z-index: 10;

            clip-path: inset(0 0 0 0);
        }


        .subtitle {
            margin: 0;

            font-size: 15px;
            line-height: 1.5;

            color: #003700;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;
        }


        /* =========================
           メイン
           ========================= */

        .main {
            min-height: 635px;
        }


        /* =========================
           メッセージ
           ========================= */

        .message {
            width: 45%;

            box-sizing: border-box;

            margin: 0;

            padding: 22px 38px 25px 38px;

            position: relative;
            z-index: 10;

            clip-path: inset(0 0 0 0);
        }


        /* 上3行 */
        .message-main {
            margin: 0;

            text-align: center;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;

            font-size: 34px;
            font-weight: 600;
            font-style: italic;

            line-height: 1.4;

            color: #4A7FE8;

            text-shadow:
                3px 4px 3px rgba(74, 127, 232, 0.22);
        }


        .message-main span {
            display: block;
            white-space: nowrap;
        }


        /* 「それが―」 */
        .message-bridge {
            margin-top: 2px;
        }


        /* メッセージ内の「みんなのまち会議」 */
        .message-name {
            display: block;

            margin-top: 8px;

            text-align: center;

            white-space: nowrap;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;

            font-size: 48px;
            font-weight: 700;

            color: #D326E8;

            text-shadow:
                2px 3px 2px rgba(211, 38, 232, 0.15);
        }


        /* =========================
           紹介文
           ========================= */

        .message-copy {
            margin: 15px 0 0 0;

            font-size: 20px;
            line-height: 2;

            color: #3F416D;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                "Meiryo",
                sans-serif;

            font-weight: 500;
        }


        /* =========================
           写真
           ========================= */

        .photo {
            position: absolute;

            top: 0;
            right: 0;

            width: 55%;

            /*
               635pxから上下4.5pxずつカット
               635 - 9 = 626px
            */
            height: 626px;

            overflow: hidden;

            z-index: 0;
        }


        .photo img {
            width: 100%;
            height: 635px;

            object-fit: cover;

            display: block;

            /*
               上4.5pxを隠す
               → 下側も4.5px隠れる
            */
            margin-top: -4.5px;
        }


        /* =========================
           スマホ用
           ========================= */

        @media (max-width: 768px) {

            .top-space {
                height: 8px;
            }


            .header {
                padding: 16px 24px 12px 24px;

                display: block;
            }


            .title {
                font-size: 32px;
            }


            .nav-menu {
                margin-top: 14px;

                gap: 14px;

                flex-wrap: wrap;
            }


            .nav-menu a {
                font-size: 12px;
            }


            .subtitle-line {
                padding: 0 24px 8px 24px;
            }


            .subtitle {
                font-size: 13px;
            }


            .main {
                min-height: auto;
            }


            .photo {
                position: static;

                width: 100%;

                /*
                   350pxから上下4.5pxずつカット
                */
                height: 341px;

                overflow: hidden;
            }


            .photo img {
                width: 100%;
                height: 350px;

                object-fit: cover;

                display: block;

                margin-top: -4.5px;
            }


            .message {
                width: 100%;

                margin: 0;

                padding: 18px 18px 25px 18px;
            }


            .message-main {
                font-size: 26px;
            }


            .message-name {
                font-size: 34px;
            }


            .message-copy {
                margin-top: 15px;

                font-size: 20px;
                line-height: 1.6;
            }

        }

    </style>

</head>


<body>


    <div class="top-space"></div>


    <header class="header">

        <h1 class="title">
            みんなのまち会議
        </h1>


        <nav class="nav-menu">

            <a href="news.html">
                ニュース
            </a>

            <a href="about.html">
                まち会議とは
            </a>

            <a href="organization.html">
                団体概要
            </a>

        </nav>

    </header>


    <div class="subtitle-line">

        <p class="subtitle">
            若者と、はちおうじの街を考える会議
        </p>

    </div>


    <div class="photo">

        <img
            src="main-photo.jpg"
            alt="みんなのまち会議の様子"
        >

    </div>


    <main class="main">

        <div class="message">

            <p class="message-main">

                <span>
                    誰もが地域の未来づくりに
                </span>

                <span>
                    参加できるコミュニティ
                </span>

                <span class="message-bridge">
                    それが―
                </span>

            </p>


            <span class="message-name">
                みんなのまち会議
            </span>


            <p class="message-copy">
                地域コミュニティの希薄化や高齢化が進み、住民同士が顔を合わせたり、地域について語り合ったりする機会が少なくなった中、みんなのまち会議は、世代を超えた交流を通して、人と人とのつながりを育み、地域の課題や未来について一緒に考える場を作ることを目指しています。
            </p>

        </div>

    </main>


    <script>

        const header =
            document.querySelector(".header");

        const subtitleLine =
            document.querySelector(".subtitle-line");

        const message =
            document.querySelector(".message");


        function clipUnderHeader(element) {

            const headerBottom =
                header.getBoundingClientRect().bottom;

            const elementTop =
                element.getBoundingClientRect().top;

            const elementHeight =
                element.offsetHeight;


            const overlap =
                Math.max(
                    0,
                    headerBottom - elementTop
                );


            const clipAmount =
                Math.min(
                    overlap,
                    elementHeight
                );


            element.style.clipPath =
                `inset(${clipAmount}px 0 0 0)`;

        }


        function updateScroll() {

            clipUnderHeader(subtitleLine);

            clipUnderHeader(message);

        }


        window.addEventListener(
            "scroll",
            updateScroll
        );


        window.addEventListener(
            "resize",
            updateScroll
        );


        updateScroll();

    </script>


</body>

</html>
