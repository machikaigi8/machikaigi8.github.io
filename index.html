<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>みんなのまち会議</title>

    <style>
        body {
            margin: 0;
        }

        .main {
            display: flex;
            min-height: 635px;

            /* 黄色帯を重ねるための基準 */
            position: relative;
        }

        /* 黄色の帯 */
        .yellow-line {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 128px;

            background-color: rgba(255, 220, 100, 0.25);

            z-index: 2;
        }

        .left {
            width: 45%;
            position: relative;
            z-index: 3;
        }

        .right {
            width: 55%;
        }

        h1 {
            text-align: left;
            margin: 0;
            padding: 38px;

            /* h1自体には背景を付けない */
            background-color: transparent;

            position: relative;
            z-index: 3;
        }

        p {
            padding: 25px 38px;
        }

        .right img {
            width: 100%;
            height: 635px;
            object-fit: cover;
            display: block;
        }

    </style>

</head>

<body>

    <div class="main">

        <!-- 画面全体を横切る黄色の帯 -->
        <div class="yellow-line"></div>

        <div class="left">

            <h1>みんなのまち会議</h1>

            <p>リリースまで少々お待ちください。</p>

        </div>

        <div class="right">

            <img src="main-photo.jpg" alt="みんなのまち会議">

        </div>

    </div>

</body>

</html>
