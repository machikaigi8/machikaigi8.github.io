<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- 制作中なので検索結果に表示させない -->
    <meta name="robots" content="noindex, nofollow">

    <title>みんなのまち会議</title>

    <style>

        body {
            margin: 0;
        }


        /* =========================
           最上部 8px
           ========================= */

        .top-space {
            height: 8px;

            background-color:
                rgba(255, 220, 100, 0.80);

            position: relative;
            z-index: 10;
        }


        /* =========================
           固定ヘッダー
           ========================= */

        .header {
            position: sticky;
            top: 0;

            width: 100%;

            box-sizing: border-box;

            padding: 18px 34px 12px 34px;

            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            background-color:
                rgba(255, 220, 100, 0.80);

            z-index: 100;
        }


        /* みんなのまち会議 */
        .title {
            margin: 0;

            font-size: 54px;
            line-height: 1;

            font-family:
                "HGP創英ﾌﾟﾚｾﾞﾝｽEB",
                sans-serif;

            color: #001E00;

            white-space: nowrap;
        }


        /* =========================
           ナビゲーション
           ========================= */

        .nav-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }


        .nav-menu a {
            color: #000000;

            text-decoration: none;

            font-size: 24px;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            white-space: nowrap;

            transition: opacity 0.2s;
        }


        .nav-menu a:hover {
            opacity: 0.55;
        }


        /* =========================
           サブタイトル帯
           ========================= */

        .subtitle-line {
            width: 100%;

            box-sizing: border-box;

            padding: 0 34px 8px 34px;

            background-color:
                rgba(255, 220, 100, 0.80);

            position: relative;
            z-index: 10;

            clip-path: inset(0 0 0 0);
        }


        .subtitle {
            margin: 0;

            font-size: 15px;
            line-height: 1.5;

            color: #003700;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;
        }


        /* =========================
           メイン
           ========================= */

        .main {
            min-height: 635px;
        }


        /* =========================
           メッセージ
           ========================= */

        .message {
            width: 45%;

            box-sizing: border-box;

            margin: 0;

            padding: 45px 38px 25px 38px;

            position: relative;
            z-index: 10;

            clip-path: inset(0 0 0 0);
        }


        /* メッセージの見出し */
        .message-title {
            margin: 0 0 24px 0;

            font-size: 20px;
            line-height: 1.8;

            color: #003700;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                serif;
        }


        /* リリース文 */
        .message-copy {
            margin: 0;

            font-size: 18px;
        }


        /* =========================
           写真
           ========================= */

        .photo {
            position: absolute;

            top: 0;
            right: 0;

            width: 55%;

            z-index: 0;
        }


        .photo img {
            width: 100%;
            height: 635px;

            object-fit: cover;

            display: block;
        }


        /* =========================
           スマホ用
           ========================= */

        @media (max-width: 768px) {

            .top-space {
                height: 8px;
            }


            .header {
                padding: 16px 24px 12px 24px;

                display: block;
            }


            .title {
                font-size: 32px;
            }


            .nav-menu {
                margin-top: 14px;

                gap: 14px;

                flex-wrap: wrap;
            }


            .nav-menu a {
                font-size: 12px;
            }


            .subtitle-line {
                padding: 0 24px 8px 24px;
            }


            .subtitle {
                font-size: 13px;
            }


            .main {
                min-height: auto;
            }


            .photo {
                position: static;

                width: 100%;
            }


            .photo img {
                width: 100%;
                height: 350px;

                object-fit: cover;
            }


            .message {
                width: 100%;

                margin: 0;

                padding: 28px 24px;
            }


            .message-title {
                font-size: 20px;
            }


            .message-copy {
                font-size: 16px;
            }

        }

    </style>

</head>


<body>


    <div class="top-space"></div>


    <header class="header">

        <h1 class="title">
            みんなのまち会議
        </h1>


        <nav class="nav-menu">

            <a href="news.html">
                ニュース
            </a>

            <a href="about.html">
                まち会議とは
            </a>

            <a href="organization.html">
                団体概要
            </a>

        </nav>

    </header>


    <div class="subtitle-line">

        <p class="subtitle">
            若者と、はちおうじの街を考える会議
        </p>

    </div>


    <div class="photo">

        <img
            src="main-photo.jpg"
            alt="みんなのまち会議の様子"
        >

    </div>


    <main class="main">

        <div class="message">

            <p class="message-title">
                誰もが地域の未来づくりに参加できるコミュニティ、<br>
                それが「みんなのまち会議」
            </p>

            <p class="message-copy">
                リリースまで少々お待ちください。
            </p>

        </div>

    </main>


    <script>

        const header =
            document.querySelector(".header");

        const subtitleLine =
            document.querySelector(".subtitle-line");

        const message =
            document.querySelector(".message");


        function clipUnderHeader(element) {

            const headerBottom =
                header.getBoundingClientRect().bottom;

            const elementTop =
                element.getBoundingClientRect().top;

            const elementHeight =
                element.offsetHeight;


            const overlap =
                Math.max(
                    0,
                    headerBottom - elementTop
                );


            const clipAmount =
                Math.min(
                    overlap,
                    elementHeight
                );


            element.style.clipPath =
                `inset(${clipAmount}px 0 0 0)`;

        }


        function updateScroll() {

            clipUnderHeader(subtitleLine);

            clipUnderHeader(message);

        }


        window.addEventListener(
            "scroll",
            updateScroll
        );


        window.addEventListener(
            "resize",
            updateScroll
        );


        updateScroll();

    </script>


</body>

</html>
