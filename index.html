<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>みんなのまち会議</title>

    <style>
        body {
            margin: 0;
        }

        .main {
            display: flex;
            min-height: 500px;
        }

        .left {
            width: 35%;
        }

        h1 {
            background-color: #FFDC64;
            text-align: left;
            margin: 0;
            padding: 30px;
        }

        p {
            padding: 20px 30px;
        }

        .right {
            width: 65%;
        }

        .right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>

</head>

<body>

    <div class="main">

        <div class="left">
            <h1>みんなのまち会議</h1>

            <p>リリースまで少々お待ちください。</p>
        </div>

        <div class="right">
            <img src="main-photo.jpg" alt="">
        </div>

    </div>

</body>

</html>
